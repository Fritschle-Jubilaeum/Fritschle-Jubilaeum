<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<meta name="description" content="Fritschle – 80 Jahre Jubiläumsausflug München, 15.–17. Oktober 2026">
<title>Fritschle · 80 Jahre · München 2026</title>

<style>
:root{
  --bg:#050c14;
  --bg2:#0b1726;
  --panel:#102337;
  --panel2:#142b41;
  --line:#29435c;
  --white:#fff;
  --muted:#aebbc8;
  --green:#78a64a;
  --green2:#9bc36c;
  --orange:#f28a2b;
  --gold:#d8b15b;
  --gold2:#f0d58a;
  --shadow:0 18px 50px rgba(0,0,0,.28);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#03070c;
  color:var(--white);
  font-family:Inter,Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,a{
  font:inherit;
}

a{
  color:inherit;
}

.app{
  width:min(760px,100%);
  min-height:100vh;
  margin:auto;
  background:
    linear-gradient(180deg,#081522 0%,#0b1726 42%,#0b1827 100%);
  box-shadow:0 0 80px rgba(0,0,0,.35);
  position:relative;
}

.top{
  position:sticky;
  top:0;
  z-index:50;
  height:70px;
  padding:10px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(7,17,29,.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand{
  border:0;
  background:transparent;
  padding:0;
  cursor:pointer;
}

.brand-text{
  text-align:left;
  line-height:.9;
}

.brand-text strong{
  display:block;
  color:#fff;
  font-size:25px;
  font-weight:900;
  letter-spacing:3px;
}

.brand-text span{
  display:block;
  color:#fff;
  font-size:9px;
  letter-spacing:1.5px;
  margin-top:5px;
}

.brand-text i{
  display:inline-block;
  width:6px;
  height:6px;
  background:var(--orange);
  margin-left:3px;
  border-radius:1px;
}

.menu{
  width:44px;
  height:44px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#102337;
  color:#fff;
  font-size:23px;
  cursor:pointer;
}

.content{
  padding:18px 16px 112px;
}

.page{
  animation:fade .22s ease;
}

@keyframes fade{
  from{
    opacity:.4;
    transform:translateY(4px)
  }
  to{
    opacity:1;
    transform:none
  }
}

/* STARTSEITE */

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid #2b4358;
  border-radius:26px;
  background:#050b12;
  padding:25px 20px 0;
  text-align:center;
  box-shadow:var(--shadow);
}

.hero-brand{
  position:relative;
  z-index:2;
  text-align:left;
  margin:0 0 18px;
}

.hero-brand strong{
  display:block;
  color:#fff;
  font-size:31px;
  line-height:1;
  font-weight:900;
  letter-spacing:4px;
}

.hero-brand span{
  display:block;
  color:#fff;
  font-size:11px;
  line-height:1;
  margin-top:5px;
  letter-spacing:1.5px;
}

.hero-brand i{
  display:inline-block;
  width:7px;
  height:7px;
  background:var(--orange);
  border-radius:1px;
  margin-left:4px;
}

.seal{
  position:relative;
  z-index:2;
  width:118px;
  height:118px;
  border:3px solid var(--gold);
  border-radius:50%;
  margin:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--gold2);
  box-shadow:
    0 0 0 8px rgba(216,177,91,.07),
    inset 0 0 28px rgba(216,177,91,.07);
}

.seal b{
  font-size:50px;
  line-height:.85;
}

.seal span{
  font-size:15px;
  letter-spacing:3px;
  font-weight:800;
  margin-top:8px;
}

.hero h1{
  position:relative;
  z-index:2;
  margin:17px 0 0;
  font-size:23px;
  letter-spacing:1.8px;
}

.hero .munich{
  position:relative;
  z-index:2;
  color:#fff;
  font-size:30px;
  font-weight:800;
  font-style:italic;
  margin-top:3px;
}

.hero .date{
  position:relative;
  z-index:2;
  color:#fff;
  font-weight:800;
  letter-spacing:1.5px;
  font-size:13px;
  margin-top:7px;
}

.hero-photo{
  position:relative;
  z-index:1;
  width:calc(100% + 40px);
  height:190px;
  object-fit:cover;
  display:block;
  margin:22px -20px 0;
  border-top:1px solid rgba(216,177,91,.35);
  border-bottom:1px solid rgba(216,177,91,.35);
}

.skyline{
  height:65px;
  margin:0 -20px;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(
      180deg,
      transparent 0%,
      rgba(216,177,91,.08) 100%
    );
}

.skyline::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:48px;
  background:
    linear-gradient(
      135deg,
      transparent 0 8%,
      rgba(216,177,91,.65) 8% 9%,
      transparent 9% 13%,
      rgba(216,177,91,.75) 13% 14%,
      transparent 14% 18%,
      rgba(216,177,91,.55) 18% 20%,
      transparent 20% 25%,
      rgba(216,177,91,.75) 25% 26%,
      transparent 26% 32%,
      rgba(216,177,91,.6) 32% 34%,
      transparent 34% 39%,
      rgba(216,177,91,.7) 39% 40%,
      transparent 40% 47%,
      rgba(216,177,91,.65) 47% 49%,
      transparent 49% 56%,
      rgba(216,177,91,.8) 56% 57%,
      transparent 57% 63%,
      rgba(216,177,91,.6) 63% 65%,
      transparent 65% 72%,
      rgba(216,177,91,.8) 72% 73%,
      transparent 73% 80%,
      rgba(216,177,91,.6) 80% 83%,
      transparent 83% 88%,
      rgba(216,177,91,.8) 88% 89%,
      transparent 89%
    );
  opacity:.85;
}

.slogan{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:18px 0 0;
}

.slogan-item{
  color:#fff;
  font-size:11px;
  font-weight:700;
  line-height:1.3;
}

.slogan-item .sicon{
  width:31px;
  height:31px;
  border:1px solid rgba(216,177,91,.7);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 7px;
  color:var(--gold2);
  font-size:13px;
}

.slogan-item span{
  display:block;
}

.section-title{
  margin:25px 0 12px;
  color:var(--orange);
  font-size:23px;
  letter-spacing:.2px;
}

.lead{
  color:#edf2f6;
  line-height:1.65;
  margin:0 0 13px;
}

.notice{
  border-left:4px solid var(--orange);
  background:#10263a;
  border-radius:0 15px 15px 0;
  padding:14px 15px;
  color:#fff;
  line-height:1.55;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
  margin-top:15px;
}

.tile{
  min-height:102px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:17px;
  background:linear-gradient(145deg,#142b41,#0f2235);
  color:#fff;
  padding:16px;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.tile .ico{
  font-size:22px;
  color:var(--gold);
  display:block;
  margin-bottom:10px;
}

.tile b{
  display:block;
  font-size:15px;
  margin-bottom:5px;
}

.tile small{
  color:var(--muted);
  line-height:1.35;
}

/* KARTEN / CARDS */

.card{
  border:1px solid var(--line);
  background:linear-gradient(145deg,#142a40,#102235);
  border-radius:18px;
  padding:16px;
  margin:11px 0;
  box-shadow:0 10px 25px rgba(0,0,0,.13);
}

.card h3{
  margin:0 0 8px;
  font-size:17px;
}

.card p{
  color:#d5dfe7;
  line-height:1.52;
  margin:6px 0;
}

.muted{
  color:var(--muted);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:#fff;
  font-weight:800;
  padding:11px 14px;
  cursor:pointer;
  margin-top:9px;
}

.btn.orange{
  background:var(--orange);
}

.btn.gold{
  background:#a98432;
}

.btn.block{
  width:100%;
}

/* PROGRAMM */

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:10px 0 15px;
}

.tab{
  border:1px solid var(--line);
  background:#102337;
  color:#dfe6ec;
  border-radius:12px;
  padding:11px 6px;
  font-weight:800;
  cursor:pointer;
}

.tab.active{
  background:var(--orange);
  border-color:var(--orange);
  color:#fff;
}

.day-card{
  border:1px solid var(--line);
  border-radius:19px;
  background:linear-gradient(135deg,#172f46,#102337);
  padding:17px;
  margin-bottom:16px;
}

.program-photo{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:15px;
  display:block;
  margin-bottom:16px;
  border:1px solid var(--line);
}

.day-card .kicker{
  font-size:11px;
  letter-spacing:2px;
  color:var(--green2);
  font-weight:900;
}

.day-card h2{
  margin:5px 0 0;
  font-size:24px;
}

.timeline{
  position:relative;
  margin:18px 0 0 2px;
}

.timeline:before{
  content:"";
  position:absolute;
  left:10px;
  top:11px;
  bottom:12px;
  width:2px;
  background:#35536e;
}

.event{
  position:relative;
  padding:0 0 20px 40px;
}

.event:before{
  content:"";
  position:absolute;
  left:4px;
  top:7px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--orange);
  box-shadow:0 0 0 4px #102337;
}

.event time{
  display:block;
  color:var(--gold2);
  font-size:21px;
  line-height:1.15;
  font-weight:950;
  margin-bottom:5px;
}

.event strong{
  display:block;
  font-size:17px;
  line-height:1.3;
}

.event p{
  margin:5px 0 0;
  color:#b8c5d0;
  line-height:1.45;
  font-size:14px;
}

.change{
  border:1px solid rgba(120,166,74,.65);
  background:rgba(120,166,74,.1);
  border-radius:16px;
  padding:14px;
  margin:12px 0;
}

.change b{
  color:var(--green2);
  font-size:12px;
  letter-spacing:1.5px;
}

.change .new{
  font-size:25px;
  color:var(--green2);
  font-weight:900;
  margin-top:3px;
}

.change del{
  color:#728191;
  margin-right:7px;
}

.variant{
  border:1px solid var(--line);
  border-radius:18px;
  background:#102337;
  padding:17px;
  margin:12px 0;
  position:relative;
  overflow:hidden;
}

.variant.green{
  border-left:5px solid var(--green);
}

.variant.orange{
  border-left:5px solid var(--orange);
}

.variant .label{
  display:inline-block;
  font-size:12px;
  letter-spacing:1.5px;
  font-weight:900;
  color:var(--green2);
  margin-bottom:7px;
}

.variant.orange .label{
  color:var(--orange);
}

.variant h3{
  margin:0;
  color:#fff;
  font-size:19px;
}

.variant p{
  margin:7px 0;
  color:#c8d3dc;
  line-height:1.5;
}

.route-box{
  border:1px solid rgba(216,177,91,.35);
  border-radius:14px;
  padding:12px;
  margin-top:12px;
  background:rgba(216,177,91,.05);
}

.route-box b{
  color:var(--gold2);
}

.route-box p{
  margin:5px 0;
}

/* BILDER */

.feature-image{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:17px;
  display:block;
  border:1px solid var(--line);
  margin-bottom:13px;
}

.info-photo,
.place-photo{
  width:100%;
  height:190px;
  object-fit:cover;
  border-radius:16px;
  display:block;
  border:1px solid var(--line);
  margin-bottom:13px;
}

/* ORTE */

.place{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#102337;
  padding:14px;
  margin:9px 0;
}

.place b{
  display:block;
}

.place small{
  display:block;
  color:var(--muted);
  margin-top:3px;
  line-height:1.35;
}

/* NACHTLEBEN */

.night{
  border:1px solid var(--line);
  border-radius:17px;
  background:#102337;
  padding:15px;
  margin:10px 0;
}

.night h3{
  margin:0 0 4px;
  color:#fff;
  font-size:18px;
}

.night .meta{
  color:var(--gold2);
  font-size:13px;
  font-weight:800;
}

.night p{
  color:#bcc8d3;
  line-height:1.45;
  margin:7px 0;
}

.night-photo{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:14px;
  display:block;
  margin-bottom:13px;
  border:1px solid var(--line);
}

/* WETTER */

.weather-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.weather-box{
  background:#102337;
  border:1px solid var(--line);
  border-radius:14px;
  text-align:center;
  padding:13px;
}

.weather-box b{
  display:block;
  color:var(--orange);
  font-size:13px;
}

.weather-box span{
  display:block;
  color:var(--muted);
  margin-top:5px;
  font-size:12px;
}

.countdown{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.countdown .n{
  border:1px solid var(--line);
  background:#0c1d2f;
  border-radius:13px;
  padding:12px 4px;
  text-align:center;
}

.countdown strong{
  display:block;
  font-size:22px;
  color:var(--gold2);
}

.countdown small{
  color:var(--muted);
  font-size:10px;
}

/* ROUTES */

.route-card{
  border:1px solid var(--line);
  border-radius:17px;
  background:#102337;
  padding:15px;
  margin:10px 0;
}

.route-card h3{
  margin:0 0 4px;
}

.route-card p{
  color:var(--muted);
  margin:4px 0;
  line-height:1.45;
}

/* LISTE */

.list{
  display:grid;
  gap:10px;
}

.list button{
  width:100%;
  text-align:left;
  border:1px solid var(--line);
  border-radius:16px;
  background:#102337;
  color:#fff;
  padding:15px;
  cursor:pointer;
}

.list b{
  display:block;
  margin-bottom:5px;
}

.list span{
  color:var(--muted);
  font-size:13px;
}

/* FOOTER */

.footer{
  text-align:center;
  color:#738292;
  font-size:11px;
  margin:28px 0 0;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  z-index:60;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(760px,100%);
  height:76px;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:rgba(5,13,22,.97);
  backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.09);
}

.bottom button{
  border:0;
  background:transparent;
  color:#7e8d9d;
  cursor:pointer;
  font-size:20px;
}

.bottom button span{
  display:block;
  font-size:10px;
  margin-top:3px;
}

.bottom button.active{
  color:var(--green2);
}

/* DRAWER */

.drawer{
  position:fixed;
  z-index:70;
  inset:0;
  background:rgba(0,0,0,.58);
  display:none;
}

.drawer.open{
  display:block;
}

.drawer-panel{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(350px,90%);
  background:#0b1726;
  border-left:1px solid var(--line);
  padding:20px;
  box-shadow:-20px 0 50px rgba(0,0,0,.4);
}

.drawer-panel h2{
  margin:6px 0 18px;
  color:var(--orange);
}

.drawer-panel button{
  width:100%;
  text-align:left;
  background:#102337;
  border:1px solid var(--line);
  color:#fff;
  border-radius:13px;
  padding:14px;
  margin:5px 0;
  cursor:pointer;
}

.close{
  float:right;
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  cursor:pointer;
}

.small-note{
  font-size:12px;
  color:#7e8d9d;
  line-height:1.45;
}

/* MOBILE */

@media(max-width:480px){

  .content{
    padding-left:13px;
    padding-right:13px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .hero h1{
    font-size:21px;
    letter-spacing:1.2px;
  }

  .hero .munich{
    font-size:28px;
  }

  .hero-brand strong{
    font-size:29px;
  }

  .slogan-item{
    font-size:10px;
  }

  .event time{
    font-size:21px;
  }

  .event strong{
    font-size:16px;
  }

  .program-photo{
    height:175px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <button class="brand" data-page="home" aria-label="Startseite">
    <div class="brand-text">
      <strong>FRITSCHLE</strong>
      <span>baut <i></i></span>
    </div>
  </button>

  <button class="menu" id="menuBtn" aria-label="Menü">☰</button>
</header>

<main id="app" class="content"></main>

<nav class="bottom" aria-label="Hauptnavigation">
  <button data-page="home">⌂<span>Start</span></button>
  <button data-page="programm">▣<span>Programm</span></button>
  <button data-page="karte">⌖<span>Karte</span></button>
  <button data-page="infos">ⓘ<span>Infos</span></button>
  <button data-page="mehr">☰<span>Mehr</span></button>
</nav>

</div>

<div class="drawer" id="drawer">
  <div class="drawer-panel">
    <button class="close" id="closeDrawer">×</button>

    <h2>FRITSCHLE · Mehr</h2>

    <button data-page="programm">▣ &nbsp; Programm</button>
    <button data-page="karte">⌖ &nbsp; Karten & Routen</button>
    <button data-page="infos">ⓘ &nbsp; Infos & Adressen</button>
    <button data-page="nachtleben">♫ &nbsp; Nachtleben – Vorschläge</button>
    <button data-page="wetter">☀ &nbsp; Wetter & Countdown</button>

    <p class="small-note">
      Die Nachtleben-Einträge sind ausschließlich Vorschläge.
      Öffnungszeiten bitte vor dem Besuch prüfen.
    </p>
  </div>
</div>

<script>

/* GOOGLE MAPS */

const maps=q =>
  'https://www.google.com/maps/search/?api=1&query='+
  encodeURIComponent(q);

const route=(from,to,mode='walking') =>
  'https://www.google.com/maps/dir/?api=1&origin='+
  encodeURIComponent(from)+
  '&destination='+
  encodeURIComponent(to)+
  '&travelmode='+
  mode;


/* BILDER */

const images={

  home:
  'https://commons.wikimedia.org/wiki/Special:FilePath/Olympiaturm_bei_Nacht.jpg',

  thursday:
  'https://commons.wikimedia.org/wiki/Special:FilePath/Munich_-_Platzl_street_and_bars_-_7644.jpg',

  friday:
  'https://commons.wikimedia.org/wiki/Special:FilePath/Munich_-_BMW_Welt.jpg',

  tum:
  'https://commons.wikimedia.org/wiki/Special:FilePath/TUM_Architektur.jpg',

  bmw:
  'https://commons.wikimedia.org/wiki/Special:FilePath/Munich_-_BMW_Welt.jpg',

  arena:
  'https://commons.wikimedia.org/wiki/Special:FilePath/Allianz_Arena.jpg',

  gop:
  'https://commons.wikimedia.org/wiki/Special:FilePath/GOP_Variete_Theater_Munich.jpg',

  saturday:
  'https://commons.wikimedia.org/wiki/Special:FilePath/Munich_-_Marienplatz.jpg',

  hofbraeuhaus:

function render(){

  app.innerHTML =
    pages[page]
      ? pages[page]()
      : pages.home();


  document
    .querySelectorAll('.bottom [data-page]')
    .forEach(b=>{
      b.classList.toggle(
        'active',
        b.dataset.page===page
      );
    });


  document
    .querySelectorAll('[data-page]')
    .forEach(b=>{
      b.onclick=()=>{
        closeDrawer();
        nav(b.dataset.page);
      };
    });


  document
    .querySelectorAll('[data-day]')
    .forEach(b=>{
      b.onclick=()=>{
        day=b.dataset.day;
        render();
        window.scrollTo({
          top:0,
          behavior:'smooth'
        });
      };
    });


  if(page==='wetter'){
    startCountdown();
  }

}


/* COUNTDOWN */

function startCountdown(){

  const el=document.getElementById('countdown');

  if(!el)return;

  const target =
    new Date(
      '2026-10-15T14:00:00+02:00'
    ).getTime();


  const tick=()=>{

    const d=
      Math.max(
        0,
        target-Date.now()
      );


    const days=
      Math.floor(
        d/86400000
      );


    const hrs=
      Math.floor(
        d%86400000/3600000
      );


    const min=
      Math.floor(
        d%3600000/60000
      );


    const sec=
      Math.floor(
        d%60000/1000
      );


    el.innerHTML=`

      <div class="n">
        <strong>${days}</strong>
        <small>Tage</small>
      </div>

      <div class="n">
        <strong>${String(hrs).padStart(2,'0')}</strong>
        <small>Std.</small>
      </div>

      <div class="n">
        <strong>${String(min).padStart(2,'0')}</strong>
        <small>Min.</small>
      </div>

      <div class="n">
        <strong>${String(sec).padStart(2,'0')}</strong>
        <small>Sek.</small>
      </div>

    `;

  };


  tick();

  clearInterval(window.__timer);

  window.__timer=
    setInterval(
      tick,
      1000
    );

}


/* DRAWER */

const drawer=
  document.getElementById('drawer');

const closeDrawer=()=>{
  drawer.classList.remove('open');
};


document
  .getElementById('menuBtn')
  .onclick=()=>{
    drawer.classList.add('open');
  };


document
  .getElementById('closeDrawer')
  .onclick=
  closeDrawer;


drawer.onclick=e=>{
  if(e.target===drawer){
    closeDrawer();
  }
};


/* START */

page=
  location.hash.slice(1)
  || 'home';

if(!pages[page]){
  page='home';
}

render();

</script>
