<style>

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
background:#050c14;
color:var(--white);
font-family:Inter,Arial,Helvetica,sans-serif;

button,a{font:inherit}

.app{

min-height:100vh;
margin:auto;
background:linear-gradient(180deg,#081522 0%,#0b1726 42%,#0b1827 100%);
box-shadow:0 0 80px rgba(0,0,0,.35);

}

.top{
position:sticky;
top:0;
z-index:50;
height:70px;
padding:10px 16px;
display:flex;
align-items:center;
justify-content:flex-end;
background:rgba(7,17,29,.94);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(255,255,255,.08)
}

.brand{
border:0;
background:transparent;
padding:0;
cursor:pointer

.brand img{
width:158px;
height:46px;
object-fit:contain;
object-position:left center;
display:block

.menu{

height:44px;

.content{

.page{

@keyframes fade{
from{

to{
opacity:1;

}

.hero{
position:relative;
overflow:hidden;
border:1px solid #2b4358;
border-radius:26px;
background:#050b12;
padding:25px 20px 25px;
text-align:center;
box-shadow:var(--shadow);

.hero>*{
position:relative;
z-index:2
}

.hero-brand{
text-align:left;
margin:0 0 14px
}

.hero-brand strong{
display:block;
color:#fff;
font-size:31px;
line-height:1;
font-weight:900;
letter-spacing:4px
}

.hero-brand span{
display:block;
color:#fff;
font-size:11px;
line-height:1;
margin-top:5px;
letter-spacing:1.5px
}

.hero-brand i{
display:inline-block;
width:7px;
height:7px;

margin-left:4px;
vertical-align:middle
}

.seal{
width:126px;
height:126px;
border:2px solid var(--gold);
border-radius:50%;
margin:8px auto 18px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:rgba(5,11,18,.64);

box-shadow:
0 0 12px rgba(199,150,62,.38),
0 0 30px rgba(199,150,62,.22);

animation:sealGoldGlow 3.8s ease-in-out infinite;
transform-origin:center center
}

@keyframes sealGoldGlow{

0%,100%{
border-color:var(--gold);

box-shadow:
0 0 10px rgba(199,150,62,.32),
0 0 25px rgba(199,150,62,.16),
0 0 40px rgba(199,150,62,.06);

transform:scale(1);
}

50%{
border-color:var(--gold);

box-shadow:
0 0 16px rgba(199,150,62,.60),
0 0 34px rgba(199,150,62,.34),
0 0 58px rgba(199,150,62,.16);

transform:scale(1.015);
}

}

.seal:before,
.seal:after{
content:"✦";
color:var(--gold);
font-size:13px;
margin:2px;
text-shadow:
0 0 8px rgba(199,150,62,.35)
}

.seal b{
font-size:49px;
line-height:.8;
color:var(--gold);
font-weight:900;
text-shadow:
0 0 8px rgba(199,150,62,.35),
0 0 18px rgba(199,150,62,.18)
}

.seal span{
font-size:13px;
letter-spacing:4px;
color:var(--gold);
margin-top:7px;
text-shadow:
0 0 8px rgba(199,150,62,.35)
}

.hero h1{
margin:10px 0 0;
font-size:24px;
letter-spacing:2px
}

.munich{
font-family:"Brush Script MT","Brush Script Std",cursive;
font-size:54px;
font-weight:900;
font-style:italic;
color:var(--gold);
line-height:1.05;
margin-top:4px;

text-shadow:
0 3px 22px #000,
0 0 8px rgba(199,150,62,.28),
0 0 18px rgba(199,150,62,.14)
}

.date{
font-size:16px;
letter-spacing:2px;
margin-top:10px;
color:#fff
}

.welcome{
margin:24px auto 0;
max-width:560px;
padding:18px;

background:rgba(5,11,18,.62);

}

.welcome h2{
margin:0 0 10px;

}

.welcome p{
margin:7px 0;
line-height:1.55;
color:#f2f5f7

.home-photo{

max-width:560px;
height:auto;
object-fit:contain;
display:block;
margin:16px auto 0;
border-radius:18px;
border:1px solid rgba(199,150,62,.38);
box-shadow:0 12px 30px rgba(0,0,0,.28)
}

.section-title{
font-size:29px;
margin:8px 0 15px
}

.sub{
color:var(--muted);
margin-top:-7px;
margin-bottom:18px
}

.tabs{

grid-template-columns:repeat(3,1fr);
gap:8px;

.tab{

color:#fff;
border-radius:14px;

}

.tab.active{

.tab small{

}

.day-card,
.card,
.variant,
.change,
.night,
.route,

.landscape-photo{

.variant-photo{

height:150px;

.kicker{

letter-spacing:2px;

font-weight:900;

.day-card h2{
margin:2px 18px 18px;

.timeline{
padding:0 18px 18px

.event{

gap:10px;

.event time{

.event time.small-time{

.event strong{

.event p{

.variant{

.night{

.night img{

.night .inside{

.night h3{

.info-box{

.info-box h3{

.info-box p,

.info-box ul{

.bottom-nav{

left:50%;

.nav-btn{

.nav-btn .ico{

}

.nav-btn.active{
color:var(--orange);

.drawer{
position:fixed;
z-index:100;
top:0;
right:-330px;
width:min(330px,88vw);
height:100vh;
background:#0b1726;

.drawer.open{

.drawer-head{

.drawer-close{

.overlay{

<script>

let page='home';

const app=document.getElementById('app');

function nav(p){
page=p;
location.hash=p;
render();
window.scrollTo({
top:0,
behavior:'smooth'
});
}

function openDrawer(){
document.getElementById('drawer').classList.add('open');
document.getElementById('drawerOverlay').classList.add('show');
}

function closeDrawer(){
document.getElementById('drawer').classList.remove('open');
document.getElementById('drawerOverlay').classList.remove('show');
}

function maps(destination){
return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(destination);
}

function route(origin,destination,mode='walking'){
return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(destination)+'&travelmode='+encodeURIComponent(mode);
}

/* RENDER */

function render(){

let body;

if(page==='home'){
body=home();
}

else if(page==='programm'){
body=programm();
}

else if(page==='karte'){
body=karte();
}

else if(page==='info'){
body=info();
}

else if(page==='nachtleben'){
body=nachtleben();
}

else if(page==='wetter'){
body=wetter();
}

else if(page==='taxi'){
body=taxi();
}

else{
body=mehr();
}

app.innerHTML=`

<header class="top">

<button
class="menu"
onclick="openDrawer()"
aria-label="Menü">
☰
</button>

</header>

<main class="content">
${body}
</main>

`;

document
.querySelectorAll('.nav-btn')
.forEach(b=>{

b.classList.toggle(
'active',

b.dataset.page===page ||

(
(page==='nachtleben' ||
page==='wetter' ||
page==='taxi')
&&
b.dataset.page==='mehr'
)

);

});

updateCountdown();

}


/* COUNTDOWN */

function updateCountdown(){

const el=document.getElementById('countdown');

if(!el){
return;
}

const target=
new Date('2026-10-15T14:00:00+02:00').getTime();

const now=Date.now();

let diff=target-now;

if(diff<=0){

el.textContent=
'Der Jubiläumsausflug hat begonnen!';

return;

}

const d=
Math.floor(diff/86400000);

diff%=86400000;

const h=
Math.floor(diff/3600000);

diff%=3600000;

const m=
Math.floor(diff/60000);

el.textContent=
`Noch ${d} Tage, ${h} Stunden und ${m} Minuten`;

}


/* NAVIGATION */

document
.querySelectorAll('.nav-btn')
.forEach(b=>{

b.addEventListener(
'click',
()=>nav(b.dataset.page)
);

});

window.addEventListener(
'hashchange',
()=>{

const h=
location.hash.replace('#','');

if(h){

page=h;

render();

}

});

if(location.hash){

page=
location.hash.replace('#','')
||
'home';

}

render();

setInterval(
updateCountdown,
60000
);

</script>
