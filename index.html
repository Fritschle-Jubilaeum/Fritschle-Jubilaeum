<!doctype html>

<head>

<style>
:root{
--bg:#07111d;
--bg2:#0b1726;
--panel:#102337;
--panel2:#142b41;
--line:#29435c;
--white:#fff;
--muted:#aebbc8;
--green:#78a64a;
--green2:#9bc36c;
--orange:#f28a2b;
--gold:#c7963e;
--shadow:0 18px 50px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
background:#050c14;
color:var(--white);
font-family:Inter,Arial,Helvetica,sans-serif;
-webkit-font-smoothing:antialiased
}
button,a{font:inherit}
.app{
width:min(760px,100%);
min-height:100vh;
margin:auto;
background:linear-gradient(180deg,#081522 0%,#0b1726 42%,#0b1827 100%);
box-shadow:0 0 80px rgba(0,0,0,.35);
position:relative
}
.top{
position:sticky;
top:0;
z-index:50;
height:70px;
padding:10px 16px;
display:flex;
align-items:center;
justify-content:flex-end;
background:rgba(7,17,29,.94);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(255,255,255,.08)
}
.brand{border:0;background:transparent;padding:0;cursor:pointer}
.brand img{
width:158px;
height:46px;
object-fit:contain;
object-position:left center;
display:block
}
.menu{
width:44px;
height:44px;
border:1px solid var(--line);
border-radius:13px;
background:#102337;
color:#fff;
font-size:23px;
cursor:pointer
}
.content{padding:18px 16px 112px}
.page{animation:fade .22s ease}
@keyframes fade{
from{opacity:.4;transform:translateY(4px)}
to{opacity:1;transform:none}
}
.hero{
position:relative;
overflow:hidden;
border:1px solid #2b4358;
border-radius:26px;
background:#050b12;
padding:25px 20px 25px;
text-align:center;
box-shadow:var(--shadow);
min-height:650px
}
.hero>*{position:relative;z-index:2}
.hero-brand{text-align:left;margin:0 0 14px}
.hero-brand strong{
display:block;
color:#fff;
font-size:31px;
line-height:1;
font-weight:900;
letter-spacing:4px
}
.hero-brand span{
display:block;
color:#fff;
font-size:11px;
line-height:1;
margin-top:5px;
letter-spacing:1.5px
}
.hero-brand i{
display:inline-block;
width:7px;
height:7px;
background:var(--orange);
border-radius:0;
margin-left:4px;
vertical-align:middle
}
.seal{
width:126px;
height:126px;
border:2px solid var(--gold);
border-radius:50%;
margin:8px auto 18px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:rgba(5,11,18,.64);
box-shadow:
0 0 12px rgba(199,150,62,.38),
0 0 30px rgba(199,150,62,.22);
animation:sealGoldGlow 3.8s ease-in-out infinite;
transform-origin:center center
}
@keyframes sealGoldGlow{
0%,100%{
border-color:var(--gold);
box-shadow:
0 0 10px rgba(199,150,62,.32),
0 0 25px rgba(199,150,62,.16),
0 0 40px rgba(199,150,62,.06);
transform:scale(1);
}
50%{
border-color:var(--gold);
box-shadow:
0 0 16px rgba(199,150,62,.60),
0 0 34px rgba(199,150,62,.34),
0 0 58px rgba(199,150,62,.16);
transform:scale(1.015);
}
}
.seal:before,.seal:after{
content:"✦";
color:var(--gold);
font-size:13px;
margin:2px;
text-shadow:0 0 8px rgba(199,150,62,.35)
}
.seal b{
font-size:49px;
line-height:.8;
color:var(--gold);
font-weight:900;
text-shadow:
0 0 8px rgba(199,150,62,.35),
0 0 18px rgba(199,150,62,.18)
}
.seal span{
font-size:13px;
letter-spacing:4px;
color:var(--gold);
margin-top:7px;
text-shadow:0 0 8px rgba(199,150,62,.35)
}
.hero h1{margin:10px 0 0;font-size:24px;letter-spacing:2px}
.munich{
font-family:"Brush Script MT","Brush Script Std",cursive;
font-size:54px;
font-weight:900;
font-style:italic;
color:var(--gold);
line-height:1.05;
margin-top:4px;
text-shadow:
0 3px 22px #000,
0 0 8px rgba(199,150,62,.28),
0 0 18px rgba(199,150,62,.14)
}
.date{
font-size:16px;
letter-spacing:2px;
margin-top:10px;
color:#fff
}
.welcome{
margin:24px auto 0;
max-width:560px;
padding:18px;
border:1px solid rgba(199,150,62,.38);
border-radius:18px;
background:rgba(5,11,18,.62);
text-align:left
}
.welcome h2{
margin:0 0 10px;
color:var(--orange);
font-size:24px;
font-family:"Brush Script MT","Brush Script Std",cursive;
font-style:italic
}
.welcome p{
margin:7px 0;
line-height:1.55;
color:#f2f5f7
}
.home-photo{
width:100%;
max-width:560px;
height:auto;
object-fit:contain;
display:block;
margin:16px auto 0;
border-radius:18px;
border:1px solid rgba(199,150,62,.38);
box-shadow:0 12px 30px rgba(0,0,0,.28)
}
.section-title{font-size:29px;margin:8px 0 15px}
.sub{color:var(--muted);margin-top:-7px;margin-bottom:18px}
.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:14px
}
.tab{
border:1px solid var(--line);
background:#0e2032;
color:#fff;
border-radius:14px;
padding:11px 5px;
cursor:pointer;
font-weight:800
}
.tab.active{background:var(--orange);border-color:var(--orange)}
.tab small{font-weight:500;opacity:.85}
.day-card,.card,.variant,.change,.night,.route,.info-box{
background:linear-gradient(180deg,#102337,#0d1e2f);
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow);
overflow:hidden
}
.program-photo{
width:100%;
height:220px;
object-fit:cover;
object-position:center;
display:block;
grid-column:1 / -1;
border-radius:14px;
margin-top:10px;
margin-bottom:6px
}
.landscape-photo{
grid-column:1 / -1;
display:block;
width:calc(100% + 70px);
max-width:none;
height:220px !important;
aspect-ratio:16 / 9;
object-fit:cover;
object-position:center;
margin-top:10px;
margin-left:-35px;
margin-right:-35px;
margin-bottom:6px;
border-radius:0
}
.variant-photo{
width:100%;
height:150px;
object-fit:cover;
display:block;
border-radius:12px;
margin-bottom:14px
}
.kicker{
font-size:11px;
letter-spacing:2px;
color:var(--green2);
font-weight:900;
padding:18px 18px 4px
}
.day-card h2{margin:2px 18px 18px;font-size:27px}
.timeline{padding:0 18px 18px}
.event{
display:grid;
grid-template-columns:82px 1fr;
gap:10px;
padding:15px 0;
border-top:1px solid rgba(255,255,255,.08)
}
.event time{
font-size:18px;
font-weight:900;
color:var(--orange);
white-space:nowrap
}
.event time.small-time{font-size:15px}
.event strong{font-size:16px;line-height:1.35}
.event p{
grid-column:2;
margin:4px 0 0;
color:var(--muted);
line-height:1.45
}
.variant{padding:18px;margin-top:12px}
.variant .label{
display:inline-block;
color:#06101a;
background:var(--green2);
font-size:11px;
font-weight:900;
padding:6px 9px;
border-radius:8px;
letter-spacing:1px
}
.variant h3{font-size:22px;margin:11px 0 6px}
.variant p{margin:0;color:var(--muted);line-height:1.45}
.variant .nowrap-line{
white-space:nowrap;

.button-row{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:6px;
margin-top:2px
}
.thursday-buttons{flex-direction:column;align-items:flex-start}
.btn{
display:inline-flex;
align-items:center;
justify-content:center;

min-width:210px;
height:42px;
margin-top:12px;
padding:10px 13px;
border-radius:11px;
background:var(--orange);
color:#fff;
text-decoration:none;
font-size:14px;
font-weight:800;
text-align:center;
vertical-align:middle;
line-height:1.2;

cursor:pointer
}
.info-frame{
margin:14px 0 4px;
padding:12px 14px;
border:1px solid rgba(242,138,43,.45);
border-radius:13px;
background:rgba(242,138,43,.08);

font-weight:800;
line-height:1.4
}
.map-card{
height:430px;
border:1px solid var(--line);
border-radius:20px;
overflow:hidden;
background:#152231;
position:relative
}
.map-card iframe{
width:100%;
height:100%;
border:0;
filter:saturate(.72) brightness(.76)
}
.map-overlay{
position:absolute;
left:12px;
right:12px;
bottom:12px;
display:flex;
gap:8px;
flex-wrap:wrap
}
.map-chip{
background:rgba(7,17,29,.9);
border:1px solid var(--line);
padding:8px 10px;
border-radius:10px;

}
.route{padding:15px;margin-top:12px}
.route strong{display:block;font-size:16px}
.route span{
display:block;
color:var(--muted);
font-size:13px;
margin-top:4px
}
.night{padding:0;margin-top:12px}
.night img{
width:100%;
height:145px;
object-fit:cover;
display:block
}
.night .inside{padding:15px}
.night h3{margin:0 0 5px;font-size:20px}
.night p{
margin:4px 0;
color:var(--muted);
line-height:1.45
}
.info-box{padding:17px;margin-top:12px}
.info-box h3{
margin:0 0 9px;
color:var(--green2);
font-size:18px
}
.info-box p,.info-box li{
color:#dbe3e9;
line-height:1.5
}
.info-box ul{padding-left:20px}
.info-box.clickable{cursor:pointer}
.info-box.clickable:active{transform:scale(.99)}
.bottom-nav{
position:fixed;
z-index:60;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(760px,100%);
display:grid;
grid-template-columns:repeat(5,1fr);
padding:9px 8px calc(9px + env(safe-area-inset-bottom));
background:rgba(7,17,29,.96);
backdrop-filter:blur(16px);
border-top:1px solid rgba(255,255,255,.1)
}
.nav-btn{
border:0;
background:none;
color:#aebbc8;
font-size:11px;
padding:5px 2px;
cursor:pointer
}
.nav-btn .ico{
display:block;
font-size:20px;
margin-bottom:3px
}
.nav-btn.active{color:var(--orange);font-weight:900}
.drawer{
position:fixed;
z-index:100;
top:0;
right:-330px;
width:min(330px,88vw);
height:100vh;
background:#0b1726;
border-left:1px solid var(--line);
padding:22px;
transition:.25s;
box-shadow:-20px 0 50px rgba(0,0,0,.4)
}
.drawer.open{right:0}
.drawer button{
display:block;
width:100%;
text-align:left;
border:1px solid var(--line);
background:#102337;
color:#fff;
padding:14px;
border-radius:12px;
margin:8px 0;
cursor:pointer
}
.drawer .close{
background:var(--orange);
border-color:var(--orange)
}
.muted{color:var(--muted)}
.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}
.pill{
display:inline-block;
border-radius:999px;
padding:6px 10px;
background:#173048;
color:#dfe8ef;
font-size:12px;
margin:3px
}
.footer{
text-align:center;
color:#718292;
font-size:12px;
margin-top:18px;
padding-bottom:20px
}
.footer .credit{
display:block;
margin-top:4px;
color:#536474
}
.notice{
padding:13px 14px;
border:1px solid rgba(155,195,108,.3);
border-radius:14px;
background:rgba(155,195,108,.06);
color:#dce8d0;

@media(max-width:520px){
.grid2{grid-template-columns:1fr}
.event{grid-template-columns:70px 1fr}
.event time{font-size:16px}
.event time.small-time{font-size:14px}
.day-card h2{font-size:24px}
.munich{font-size:48px}
}
</style>
</head>

document.getElementById('drawer').classList.remove('open');

function nav(p){
page=p;
location.hash=p;
render();
closeDrawer();
window.scrollTo(0,0);
}

return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}`;

function render(){
let body;
if(page==='home'){body=home();}
else if(page==='programm'){body=programm();}
else if(page==='karte'){body=karte();}
else if(page==='info'){body=info();}
else if(page==='nachtleben'){body=nachtleben();}
else if(page==='wetter'){body=wetter();}
else if(page==='taxi'){body=taxi();}
else{body=mehr();}
app.innerHTML=`
<header class="top">
<button class="menu" onclick="openDrawer()" aria-label="Menü">☰</button>
</header>
<main class="content">
${body}
</main>
`;
document.querySelectorAll('.nav-btn').forEach(b=>{
b.classList.toggle(
'active',
b.dataset.page===page ||
(
(page==='nachtleben' ||
page==='wetter' ||
page==='taxi')
&&
b.dataset.page==='mehr'
)
);
});
updateCountdown();
}
function updateCountdown(){
const el=document.getElementById('countdown');
if(!el){return;}
const target=new Date('2026-10-15T14:00:00+02:00').getTime();
const now=Date.now();
let diff=target-now;
if(diff<=0){
el.textContent='Der Jubiläumsausflug hat begonnen!';
return;
}
const d=Math.floor(diff/86400000);
diff%=86400000;
const h=Math.floor(diff/3600000);
diff%=3600000;
const m=Math.floor(diff/60000);
el.textContent=`Noch ${d} Tage, ${h} Stunden und ${m} Minuten`;
}
document.querySelectorAll('.nav-btn').forEach(b=>{
b.addEventListener('click',()=>nav(b.dataset.page));
});
window.addEventListener('hashchange',()=>{
const h=location.hash.replace('#','');
if(h){
page=h;
render();
}
});
if(location.hash){
page=location.hash.replace('#','')||'home';
}
render();
setInterval(updateCountdown,60000);
</script>
