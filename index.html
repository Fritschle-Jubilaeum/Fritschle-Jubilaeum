<style>
:root{
--bg:#050505;
--bg2:#0b0b0b;
--panel:#111111;
--panel2:#171717;
--line:#303030;
--white:#fff;
--muted:#aeb5ba;
--green:#78a64a;
--green2:#9bc36c;
--orange:#f28a2b;
--gold:#d8b15b;
--gold2:#f0d58a;
--shadow:0 18px 50px rgba(0,0,0,.38)
}

*{box-sizing:border-box}

html{
scroll-behavior:smooth
}

body{
margin:0;
background:#000;
color:var(--white);
font-family:Inter,Arial,Helvetica,sans-serif;
-webkit-font-smoothing:antialiased
}

button,a{
font:inherit
}

.app{
width:min(760px,100%);
min-height:100vh;
margin:auto;
background:linear-gradient(180deg,#050505 0%,#0b0b0b 42%,#111 100%);
box-shadow:0 0 80px rgba(0,0,0,.55);
position:relative
}

.top{
position:sticky;
top:0;
z-index:50;
height:70px;
padding:10px 16px;
display:flex;
align-items:center;
justify-content:space-between;
background:rgba(5,5,5,.94);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(255,255,255,.08)
}

.brand{
border:0;
background:transparent;
padding:0;
cursor:pointer
}

.brand img{
width:158px;
height:46px;
object-fit:contain;
object-position:left center;
display:block
}

.menu{
width:44px;
height:44px;
border:1px solid var(--line);
border-radius:13px;
background:#111;
color:#fff;
font-size:23px;
cursor:pointer
}

.content{
padding:18px 16px 112px
}

.page{
animation:fade .22s ease
}

@keyframes fade{
from{
opacity:.4;
transform:translateY(4px)
}
to{
opacity:1;
transform:none
}
}

/* STARTSEITE */

.hero{
position:relative;
overflow:hidden;
border:1px solid #2e2e2e;
border-radius:26px;
background:#000;
padding:28px 20px 0;
text-align:center;
box-shadow:var(--shadow);
min-height:500px
}

.hero:before{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(circle at 50% 0%,rgba(216,177,91,.10),transparent 42%),
linear-gradient(180deg,rgba(255,255,255,.015),transparent 50%);
pointer-events:none
}

.hero .eyebrow{
position:relative;
z-index:3;
color:var(--gold2);
font-size:12px;
letter-spacing:3px;
font-weight:800;
margin-bottom:14px
}

.seal{
position:relative;
z-index:3;
width:132px;
height:132px;
border:3px solid var(--gold);
border-radius:50%;
margin:auto;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:var(--gold2);
box-shadow:
0 0 0 8px rgba(216,177,91,.07),
inset 0 0 28px rgba(216,177,91,.07)
}

.seal b{
font-size:55px;
line-height:.85
}

.seal span{
font-size:16px;
letter-spacing:3px;
font-weight:800;
margin-top:8px
}

.hero h1{
position:relative;
z-index:3;
margin:20px 0 0;
font-size:29px;
letter-spacing:2.5px
}

.hero .munich{
position:relative;
z-index:3;
color:var(--orange);
font-size:34px;
font-weight:800;
font-style:italic;
margin-top:3px
}

.hero .date{
position:relative;
z-index:3;
color:#fff;
font-weight:800;
letter-spacing:1.7px;
font-size:14px;
margin-top:8px
}

.tag{
position:relative;
z-index:3;
color:var(--gold2);
font-weight:800;
margin:20px 0 18px
}

/* GOLDENE SKYLINE AUF SCHWARZ */

.skyline{
position:absolute;
z-index:2;
left:0;
right:0;
bottom:0;
height:145px;
overflow:hidden;
background:
linear-gradient(
180deg,
transparent 0%,
rgba(0,0,0,.08) 20%,
rgba(0,0,0,.72) 100%
)
}

.skyline:after{
content:"";
position:absolute;
left:0;
right:0;
bottom:0;
height:3px;
background:linear-gradient(
90deg,
transparent,
var(--gold),
var(--gold2),
var(--gold),
transparent
);
box-shadow:0 0 18px rgba(240,213,138,.45)
}

.skyline svg{
position:absolute;
left:0;
bottom:0;
width:100%;
height:100%
}

.skyline path{
fill:rgba(216,177,91,.08);
stroke:var(--gold);
stroke-width:2.2;
opacity:.96
}

.section-title{
margin:25px 0 12px;
color:var(--orange);
font-size:23px;
letter-spacing:.2px
}

.lead{
color:#edf2f6;
line-height:1.65;
margin:0 0 13px
}

.notice{
border-left:4px solid var(--orange);
background:#171717;
border-radius:0 15px 15px 0;
padding:14px 15px;
color:#fff;
line-height:1.55
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:11px;
margin-top:15px
}

.tile{
min-height:102px;
text-align:left;
border:1px solid var(--line);
border-radius:17px;
background:linear-gradient(145deg,#171717,#101010);
color:#fff;
padding:16px;
cursor:pointer;
box-shadow:0 8px 22px rgba(0,0,0,.18)
}

.tile .ico{
font-size:22px;
color:var(--gold);
display:block;
margin-bottom:10px
}

.tile b{
display:block;
font-size:15px;
margin-bottom:5px
}

.tile small{
color:var(--muted);
line-height:1.35
}

.card{
border:1px solid var(--line);
background:linear-gradient(145deg,#171717,#111);
border-radius:18px;
padding:16px;
margin:11px 0;
box-shadow:0 10px 25px rgba(0,0,0,.18)
}

.card h3{
margin:0 0 8px;
font-size:17px
}

.card p{
color:#d5dfe7;
line-height:1.52;
margin:6px 0
}

.muted{
color:var(--muted)
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
text-decoration:none;
border:0;
border-radius:12px;
background:var(--green);
color:#fff;
font-weight:800;
padding:11px 14px;
cursor:pointer;
margin-top:9px
}

.btn.orange{
background:var(--orange)
}

.btn.gold{
background:#a98432
}

.btn.block{
width:100%
}

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin:10px 0 15px
}

.tab{
border:1px solid var(--line);
background:#111;
color:#dfe6ec;
border-radius:12px;
padding:11px 6px;
font-weight:800;
cursor:pointer
}

.tab.active{
background:var(--orange);
border-color:var(--orange);
color:#fff
}

.day-card{
border:1px solid var(--line);
border-radius:19px;
background:linear-gradient(135deg,#181818,#101010);
padding:17px;
margin-bottom:16px
}

.day-card .kicker{
font-size:11px;
letter-spacing:2px;
color:var(--green2);
font-weight:900
}

.day-card h2{
margin:5px 0 0;
font-size:24px
}

.timeline{
position:relative;
margin:15px 0 0 2px
}

.timeline:before{
content:"";
position:absolute;
left:10px;
top:11px;
bottom:12px;
width:2px;
background:#3b3b3b
}

.event{
position:relative;
padding:0 0 17px 36px
}

.event:before{
content:"";
position:absolute;
left:4px;
top:5px;
width:14px;
height:14px;
border-radius:50%;
background:var(--orange);
box-shadow:0 0 0 4px #111
}

.event time{
display:block;
color:var(--gold2);
font-size:14px;
font-weight:900;
margin-bottom:3px
}

.event strong{
display:block;
font-size:16px
}

.event p{
margin:4px 0 0;
color:#b8c5d0;
line-height:1.4;
font-size:14px
}

.variant{
border:1px solid var(--line);
border-radius:17px;
background:#111;
padding:16px;
margin:11px 0
}

.variant h3{

color:var(--orange);
font-size:16px

.variant p{

color:#c8d3dc;
line-height:1.45
}

.variant .label{

letter-spacing:1.5px;
font-weight:900;

.place{

align-items:center;
justify-content:space-between;
gap:10px;
border:1px solid var(--line);
border-radius:16px;
background:#111;
padding:14px;

.place b{
display:block

.place small{
display:block;
color:var(--muted);
margin-top:3px;
line-height:1.35
}

.list{
display:grid;
gap:10px

.list button{
width:100%;
text-align:left;
border:1px solid var(--line);
border-radius:16px;
background:#111;
color:#fff;
padding:15px;
cursor:pointer
}

.list b{
display:block;
margin-bottom:5px

.list span{
color:var(--muted);

.night{
border:1px solid var(--line);
border-radius:17px;
background:#111;
padding:15px;
margin:10px 0

.night h3{
margin:0 0 4px;
color:#fff

.night .meta{
color:var(--gold2);
font-size:13px;
font-weight:800
}

.night p{
color:#bcc8d3;
line-height:1.45;
margin:7px 0
}

.night-photo{
width:100%;
height:170px;
object-fit:cover;
border-radius:14px;
margin:0 0 13px;
display:block;
border:1px solid var(--line)
}

.weather-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}

.weather-box{
background:#111;
border:1px solid var(--line);
border-radius:14px;
text-align:center;
padding:13px
}

.weather-box b{
display:block;
color:var(--orange);
font-size:13px
}

.weather-box span{
display:block;
color:var(--muted);
margin-top:5px;
font-size:12px
}

.countdown{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px
}

.countdown .n{
border:1px solid var(--line);
background:#0c0c0c;
border-radius:13px;
padding:12px 4px;
text-align:center
}

.countdown strong{
display:block;
font-size:22px;
color:var(--gold2)
}

.countdown small{
color:var(--muted);
font-size:10px
}

.route-card{
border:1px solid var(--line);
border-radius:17px;
background:#111;
padding:15px;
margin:10px 0
}

.route-card h3{
margin:0 0 4px
}

.route-card p{
color:var(--muted);
margin:4px 0;
line-height:1.45
}

.footer{
text-align:center;
color:#738292;
font-size:11px;
margin:28px 0 0
}

.bottom{
position:fixed;
z-index:60;
left:50%;
bottom:0;
transform:translateX(-50%);
width:min(760px,100%);
height:76px;
padding:7px 8px calc(7px + env(safe-area-inset-bottom));
display:grid;
grid-template-columns:repeat(5,1fr);
background:rgba(5,5,5,.97);
backdrop-filter:blur(14px);
border-top:1px solid rgba(255,255,255,.09)
}

.bottom button{
border:0;
background:transparent;
color:#7e8d9d;
cursor:pointer;
font-size:20px
}

.bottom button span{
display:block;
font-size:10px;
margin-top:3px
}

.bottom button.active{
color:var(--green2)
}

.drawer{
position:fixed;
z-index:70;
inset:0;
background:rgba(0,0,0,.68);
display:none
}

.drawer.open{
display:block
}

.drawer-panel{
position:absolute;
right:0;
top:0;
height:100%;
width:min(350px,90%);
background:#0b0b0b;
border-left:1px solid var(--line);
padding:20px;
box-shadow:-20px 0 50px rgba(0,0,0,.55)
}

.drawer-panel h2{
margin:6px 0 18px;
color:var(--orange)
}

.drawer-panel button{
width:100%;
text-align:left;
background:#151515;
border:1px solid var(--line);
color:#fff;
border-radius:13px;
padding:14px;
margin:5px 0;
cursor:pointer
}

.close{
float:right;
border:0;
background:transparent;
color:#fff;
font-size:25px;
cursor:pointer
}

.small-note{
font-size:12px;
color:#7e8d9d;
line-height:1.45
}

@media(max-width:480px){
.grid{
grid-template-columns:1fr 1fr
}

.hero h1{
font-size:25px
}

.hero .munich{
font-size:30px
}

.content{
padding-left:13px;
padding-right:13px
}
}
</style>

function setDay(d){

});

/* RENDER */

function render(){

let html='';

if(page==='home') html=home();
if(page==='programm') html=programm();
if(page==='karte') html=karte();
if(page==='infos') html=infos();
if(page==='nachtleben') html=nachtleben();
if(page==='wetter') html=wetter();
if(page==='mehr') html=mehr();

app.innerHTML=html;

document.querySelectorAll('[data-page]').forEach(el=>{

el.addEventListener('click',()=>{

const p=el.dataset.page;

if(p==='mehr' && page==='mehr'){
nav('mehr');
return;
}

nav(p);

});

});

document.querySelectorAll('.bottom button').forEach(el=>{

el.classList.toggle(
'active',
el.dataset.page===page ||
(el.dataset.page==='mehr' &&
['nachtleben','wetter'].includes(page))
);

});

if(page==='wetter'){
startCountdown();
}

}


/* COUNTDOWN */

function startCountdown(){

const target=new Date('2026-10-15T14:00:00+02:00');

function update(){

const box=document.getElementById('countdown');

if(!box)return;

const diff=target-new Date();

if(diff<=0){

box.innerHTML=`
<div class="n">
<strong>🎉</strong>
<small>Los geht's!</small>
</div>
`;

return;
}

const days=Math.floor(diff/86400000);

const hours=Math.floor(
(diff%86400000)/3600000
);

const mins=Math.floor(
(diff%3600000)/60000
);

const secs=Math.floor(
(diff%60000)/1000
);

box.innerHTML=`

<div class="n">
<strong>${days}</strong>
<small>Tage</small>
</div>

<div class="n">
<strong>${String(hours).padStart(2,'0')}</strong>
<small>Std.</small>
</div>

<div class="n">
<strong>${String(mins).padStart(2,'0')}</strong>
<small>Min.</small>
</div>

<div class="n">
<strong>${String(secs).padStart(2,'0')}</strong>
<small>Sek.</small>
</div>

`;

}

update();

setInterval(update,1000);

}


/* MENÜ */

const drawer=document.getElementById('drawer');

document.getElementById('menuBtn').addEventListener(
'click',
()=>{
drawer.classList.add('open');
}
);

document.getElementById('closeDrawer').addEventListener(
'click',
()=>{

}
);

drawer.addEventListener('click',e=>{

drawer.classList.remove('open');
}

});

document.querySelectorAll('.drawer [data-page]').forEach(el=>{

el.addEventListener('click',()=>{

drawer.classList.remove('open');

nav(el.dataset.page);

});

});
