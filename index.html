<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<meta name="description" content="Fritschle – 80 Jahre Jubiläumsausflug München, 15.–17. Oktober 2026">
<title>Fritschle · Jubiläumsausflug München · 2026</title>

<style>

:root{
--bg:#07111d;
--card:#0d1e2f;
--card2:#102337;
--line:rgba(255,255,255,.10);
--text:#f5f7fa;
--muted:#aeb8c5;
--gold:#d8b45a;
--gold2:#f0d58b;
--orange:#f28c28;
--shadow:0 16px 45px rgba(0,0,0,.35);
}

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
background:
radial-gradient(circle at top,#132a42 0,#07111d 42%,#050b12 100%);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
}

button,
a{
font-family:inherit;
}

a{
color:inherit;
text-decoration:none;
}

#app{
width:100%;
max-width:760px;
margin:0 auto;
min-height:100vh;
padding-bottom:90px;
}

.page{
padding:18px 18px 28px;
}

.hero{
text-align:center;
padding:22px 0 10px;
}

.hero-brand{
font-size:28px;
font-weight:900;
letter-spacing:1.5px;
line-height:1;
}

.hero-brand span{
display:inline-block;
}

.hero-brand .baut{
font-size:16px;
font-weight:500;
letter-spacing:1px;
margin-left:5px;
}

.hero-brand .dot{
color:var(--orange);
font-size:25px;
margin-left:2px;
}

.seal{
width:118px;
height:118px;
margin:22px auto 14px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
border:2px solid var(--gold);
background:
radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),transparent 28%),
linear-gradient(145deg,#9c7426,#e7ca72 48%,#9a7024);
box-shadow:
0 0 0 5px rgba(216,180,90,.08),
0 0 30px rgba(216,180,90,.18),
inset 0 0 18px rgba(255,255,255,.16);
animation:goldPulse 3.8s ease-in-out infinite;
}

@keyframes goldPulse{
0%,100%{
box-shadow:
0 0 0 5px rgba(216,180,90,.08),
0 0 30px rgba(216,180,90,.18),
inset 0 0 18px rgba(255,255,255,.16);
}
50%{
box-shadow:
0 0 0 8px rgba(216,180,90,.11),
0 0 48px rgba(216,180,90,.30),
inset 0 0 22px rgba(255,255,255,.20);
}
}

.seal strong{
font-size:31px;
line-height:1;
color:#07111d;
}

.seal small{
font-size:11px;
font-weight:800;
letter-spacing:2px;
color:#07111d;
margin-top:4px;
}

.hero-title{
font-size:15px;
font-weight:700;
letter-spacing:3px;
color:var(--gold2);
margin-top:8px;
}

.hero-munich{
font-family:"Brush Script MT","Segoe Script",cursive;
font-size:48px;
line-height:1;
color:var(--gold2);
margin:2px 0 5px;
}

.hero-date{
font-size:14px;
color:var(--muted);
letter-spacing:1px;
}

.welcome{
margin-top:22px;
padding:20px;
background:linear-gradient(180deg,rgba(16,35,55,.96),rgba(10,25,39,.96));
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow);
text-align:left;
}

.welcome h2{
margin:0 0 13px;
font-size:20px;
color:var(--gold2);
}

.welcome p{
margin:0 0 11px;
line-height:1.55;
color:#dce3ea;
font-size:15px;
}

.welcome p:last-child{
margin-bottom:0;
}

.hero-photo{
width:100%;
height:230px;
object-fit:cover;
display:block;
border-radius:18px;
margin-top:18px;
box-shadow:var(--shadow);
}

.section-title{
font-size:26px;
margin:5px 0 18px;
color:var(--gold2);
}

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:16px;
}

.tab{
border:1px solid var(--line);
background:#0b1a29;
color:var(--muted);
border-radius:13px;
padding:10px 5px;
font-size:13px;
font-weight:700;
cursor:pointer;
}

.tab small{
font-size:11px;
opacity:.8;
}

.tab.active{
background:linear-gradient(135deg,#c49c45,#e1c46e);
color:#07111d;
border-color:#e1c46e;
}

.day-card{
background:linear-gradient(180deg,#102337,#0b1b2b);
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow);
padding:18px;
overflow:hidden;
}

.kicker{
font-size:12px;
text-transform:uppercase;
letter-spacing:1.7px;
color:var(--gold);
font-weight:800;
}

.day-card h2{
margin:5px 0 18px;
font-size:25px;
}

.timeline{
display:flex;
flex-direction:column;
gap:10px;
}

.event{
display:grid;
grid-template-columns:78px 1fr;
gap:12px;
padding:12px 0;
border-bottom:1px solid rgba(255,255,255,.07);
}

.event:last-child{
border-bottom:0;
}

.event time{
font-size:14px;
font-weight:800;
color:var(--gold2);
padding-top:2px;
}

.event time.small-time{
font-size:12px;
}

.event strong{
font-size:15px;
line-height:1.35;
}

.event p{
margin:4px 0 0;
font-size:13px;
line-height:1.45;
color:var(--muted);
}

.btn{
display:block;
width:100%;
padding:12px 14px;
margin:8px 0 12px;
border-radius:13px;
border:1px solid rgba(216,180,90,.32);
background:rgba(216,180,90,.08);
color:var(--gold2);
text-align:center;
font-size:13px;
font-weight:800;
transition:.2s ease;
}

.btn:hover{
background:rgba(216,180,90,.15);
}

.program-photo{
width:100%;
height:220px;
object-fit:cover;
object-position:center;
display:block;
grid-column:1 / -1;
border-radius:14px;
margin-top:10px;
margin-bottom:6px;
}

.landscape-photo{
grid-column:1 / -1;
display:block;
width:calc(100% + 70px);
max-width:none;
height:220px !important;
aspect-ratio:16 / 9;
object-fit:cover;
object-position:center;
margin-top:10px;
margin-left:-35px;
margin-right:-35px;
margin-bottom:6px;
border-radius:0;
}

.variant{
margin-top:18px;
padding:15px;
border-radius:18px;
background:rgba(255,255,255,.035);
border:1px solid rgba(255,255,255,.07);
}

.variant .label{
display:inline-block;
font-size:11px;
font-weight:900;
letter-spacing:1.5px;
color:var(--gold);
margin-bottom:8px;
}

.variant h3{
margin:4px 0 7px;
font-size:18px;
}

.variant p{
font-size:13px;
line-height:1.5;
color:var(--muted);
margin:8px 0;
}

.variant-photo{
width:100%;
height:150px;
object-fit:cover;
display:block;
border-radius:13px;
margin-bottom:10px;
}

.map-wrap{
border-radius:20px;
overflow:hidden;
border:1px solid var(--line);
box-shadow:var(--shadow);
}

.map-wrap iframe{
width:100%;
height:430px;
border:0;
display:block;
}

.chips{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:15px;
}

.chip{
padding:9px 11px;
border-radius:999px;
background:#102337;
border:1px solid var(--line);
color:#d8e0e7;
font-size:12px;
}

.info-box{
background:linear-gradient(180deg,#102337,#0d1e2f);
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow);
overflow:hidden;
padding:18px;
margin-bottom:15px;
}

.info-box h3{
margin:0 0 10px;
font-size:18px;
color:var(--gold2);
}

.info-box p{
margin:7px 0;
font-size:14px;
line-height:1.5;
color:#d6dee6;
}

.address{
padding:11px 0;
border-bottom:1px solid rgba(255,255,255,.07);
font-size:14px;
line-height:1.45;
}

.address:last-child{
border-bottom:0;
}

.night-card{
background:linear-gradient(180deg,#102337,#0d1e2f);
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow);
overflow:hidden;
margin-bottom:14px;
}

.night-card img{
width:100%;
height:170px;
object-fit:cover;
display:block;
}

.night-card-content{
padding:15px;
}

.night-card h3{
margin:0 0 6px;
font-size:18px;
color:var(--gold2);
}

.night-card p{
margin:0;
font-size:13px;
color:var(--muted);
line-height:1.45;
}

.more-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.more-tile{
padding:17px 14px;
border-radius:18px;
background:linear-gradient(180deg,#102337,#0d1e2f);
border:1px solid var(--line);
box-shadow:var(--shadow);
cursor:pointer;
min-height:120px;
}

.more-icon{
font-size:28px;
margin-bottom:9px;
}

.more-tile strong{
display:block;
font-size:14px;
margin-bottom:5px;
}

.more-tile span{
display:block;
font-size:12px;
line-height:1.4;
color:var(--muted);
}

.bottom-nav{
position:fixed;
left:50%;
bottom:0;
transform:translateX(-50%);
width:min(760px,100%);
display:grid;
grid-template-columns:repeat(5,1fr);
gap:3px;
padding:8px 7px calc(8px + env(safe-area-inset-bottom));
background:rgba(5,12,20,.94);
backdrop-filter:blur(16px);
border-top:1px solid rgba(255,255,255,.08);
z-index:50;
}

.bottom-nav button{
border:0;
background:transparent;
color:#8f9baa;
font-size:10px;
padding:6px 2px;
cursor:pointer;
}

.bottom-nav button.active{
color:var(--gold2);
}

.bottom-nav .nav-icon{
font-size:18px;
display:block;
margin-bottom:3px;
}

.drawer-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:90;
display:none;
}

.drawer{
position:fixed;
top:0;
right:0;
bottom:0;
width:min(340px,88vw);
background:#091522;
z-index:100;
transform:translateX(100%);
transition:transform .25s ease;
box-shadow:-20px 0 50px rgba(0,0,0,.45);
padding:18px;
overflow-y:auto;
}

.drawer.open{
transform:translateX(0);
}

.drawer.open + .drawer-overlay{
display:block;
}

.drawer-head{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px;
}

.drawer-head strong{
font-size:18px;
color:var(--gold2);
}

.drawer-close{
border:0;
background:#122438;
color:#fff;
width:38px;
height:38px;
border-radius:50%;
font-size:20px;
cursor:pointer;
}

.drawer button{
width:100%;
text-align:left;
border:0;
background:#0d1e2f;
color:#dce4eb;
padding:13px 14px;
border-radius:13px;
margin-bottom:8px;
font-size:14px;
cursor:pointer;
}

.drawer button:hover{
background:#132a40;
}

.footer{
text-align:center;
padding:20px 10px 10px;
color:#718091;
font-size:11px;
line-height:1.6;
}

.footer .powered{
color:#8895a4;
}

@media(max-width:600px){

.page{
padding-left:15px;
padding-right:15px;
}

.hero-photo{
height:210px;
}

.hero-munich{
font-size:44px;
}

.program-photo{
height:190px;
object-fit:cover;
}

.landscape-photo{
grid-column:1 / -1;
width:calc(100% + 70px);
max-width:none;
height:190px !important;
aspect-ratio:16 / 9;
object-fit:cover;
object-position:center;
margin-left:-35px;
margin-right:-35px;
}

.event{
grid-template-columns:70px 1fr;
}

.more-grid{
grid-template-columns:1fr 1fr;
}

}

</style>
</head>

/* COUNTDOWN */

function updateCountdown(){

const el=document.getElementById('countdown');

if(!el){
return;
}

const target=
new Date('2026-10-15T14:00:00+02:00').getTime();

function tick(){

const now=new Date().getTime();

let diff=target-now;

if(diff<=0){

el.textContent='Es geht los! 🎉';

return;

}

const days=Math.floor(diff/(1000*60*60*24));

diff%=1000*60*60*24;

const hours=Math.floor(diff/(1000*60*60));

diff%=1000*60*60;

const minutes=Math.floor(diff/(1000*60));

diff%=1000*60;

const seconds=Math.floor(diff/1000);

el.textContent=
`${days} Tage · ${hours} Std. · ${minutes} Min. · ${seconds} Sek.`;

}

tick();

setInterval(tick,1000);

}


/* HASH */

if(location.hash){

const h=location.hash.replace('#','');

if([
'home',
'programm',
'karte',
'info',
'nachtleben',
'wetter',
'mehr',
'taxi'
].includes(h)){

page=h;

}

}


/* START */

render();
