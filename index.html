<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Fritschle – 80 Jahre Jubiläumsausflug München, 15.–17. Oktober 2026">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>Fritschle · Jubiläumsausflug München 2026</title>

<style>
:root{
  --bg:#050505;
  --bg2:#0b0d0d;
  --panel:#111515;
  --panel2:#151a18;
  --line:#303834;
  --white:#fff;
  --muted:#aab2ad;
  --green:#78a64a;
  --green2:#9bc36c;
  --orange:#f28a2b;
  --gold:#d8b15b;
  --gold2:#f0d58a;
  --shadow:0 18px 50px rgba(0,0,0,.32);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#000;
  color:var(--white);
  font-family:Inter,Arial,Helvetica,sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,a{
  font:inherit;
}

.app{
  width:min(760px,100%);
  min-height:100vh;
  margin:auto;
  background:
    linear-gradient(180deg,#050505 0%,#090d0b 45%,#0a0f0d 100%);
  box-shadow:0 0 80px rgba(0,0,0,.5);
  position:relative;
}

.top{
  position:sticky;
  top:0;
  z-index:50;
  height:70px;
  padding:10px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(5,5,5,.95);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.brand{
  border:0;
  background:transparent;
  padding:0;
  cursor:pointer;
}

.brand img{
  width:158px;
  height:46px;
  object-fit:contain;
  object-position:left center;
  display:block;
}

.menu{
  width:44px;
  height:44px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#111515;
  color:#fff;
  font-size:23px;
  cursor:pointer;
}

.content{
  padding:18px 16px 112px;
}

.page{
  animation:fade .22s ease;
}

@keyframes fade{
  from{opacity:.4;transform:translateY(4px)}
  to{opacity:1;transform:none}
}

/* STARTSEITE */

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid #292e2b;
  border-radius:26px;
  background:
    radial-gradient(circle at 50% 0%,#171b18 0,#090b0a 48%,#030303 88%);
  padding:26px 20px 0;
  text-align:center;
  box-shadow:var(--shadow);
}

.hero .eyebrow{
  position:relative;
  z-index:3;
  color:var(--gold2);
  font-size:12px;
  letter-spacing:3px;
  font-weight:800;
  margin-bottom:14px;
}

.seal{
  position:relative;
  z-index:3;
  width:126px;
  height:126px;
  border:3px solid var(--gold);
  border-radius:50%;
  margin:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--gold2);
  box-shadow:
    0 0 0 8px rgba(216,177,91,.06),
    inset 0 0 28px rgba(216,177,91,.07);
}

.seal b{
  font-size:52px;
  line-height:.85;
}

.seal span{
  font-size:15px;
  letter-spacing:3px;
  font-weight:800;
  margin-top:8px;
}

.hero h1{
  position:relative;
  z-index:3;
  margin:20px 0 0;
  font-size:28px;
  letter-spacing:2.8px;
}

.hero .munich{
  position:relative;
  z-index:3;
  color:var(--orange);
  font-size:34px;
  font-weight:800;
  font-style:italic;
  margin-top:3px;
}

.hero .date{
  position:relative;
  z-index:3;
  color:#fff;
  font-weight:800;
  letter-spacing:1.7px;
  font-size:14px;
  margin-top:8px;
}

/* GOLDENE MÜNCHNER SKYLINE */

.skyline{
  position:relative;
  z-index:1;
  height:112px;
  margin:22px -20px 0;
  overflow:hidden;
}

.skyline svg{
  position:absolute;
  left:0;
  bottom:0;
  width:100%;
  height:100%;
}

.skyline path{
  fill:none;
  stroke:var(--gold);
  stroke-width:2;
  opacity:.9;
}

.skyline .fill{
  fill:rgba(216,177,91,.07);
  stroke:none;
}

/* WELCOME */

.welcome{
  padding:22px 4px 8px;
}

.welcome h2{
  color:var(--orange);
  font-size:23px;
  margin:0 0 12px;
}

.welcome p{
  color:#edf2ee;
  line-height:1.65;
  margin:0 0 13px;
}

.slogan{
  margin-top:20px;
  padding:15px 10px;
  text-align:center;
  color:var(--gold2);
  font-size:13px;
  font-weight:800;
  letter-spacing:.6px;
}

/* ALLGEMEIN */

.section-title{
  margin:25px 0 12px;
  color:var(--orange);
  font-size:23px;
  letter-spacing:.2px;
}

.lead{
  color:#edf2ee;
  line-height:1.65;
  margin:0 0 13px;
}

.notice{
  border-left:4px solid var(--orange);
  background:#121816;
  border-radius:0 15px 15px 0;
  padding:14px 15px;
  color:#fff;
  line-height:1.55;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:11px;
  margin-top:15px;
}

.tile{
  min-height:102px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:17px;
  background:linear-gradient(145deg,#151b18,#0d1110);
  color:#fff;
  padding:16px;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.18);
}

.tile .ico{
  font-size:22px;
  color:var(--gold);
  display:block;
  margin-bottom:10px;
}

.tile b{
  display:block;
  font-size:15px;
  margin-bottom:5px;
}

.tile small{
  color:var(--muted);
  line-height:1.35;
}

.card{
  border:1px solid var(--line);
  background:linear-gradient(145deg,#151b18,#0e1311);
  border-radius:18px;
  padding:16px;
  margin:11px 0;
  box-shadow:0 10px 25px rgba(0,0,0,.13);
}

.card h3{
  margin:0 0 8px;
  font-size:17px;
}

.card p{
  color:#d5ddd8;
  line-height:1.52;
  margin:6px 0;
}

.muted{
  color:var(--muted);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:#fff;
  font-weight:800;
  padding:11px 14px;
  cursor:pointer;
  margin-top:9px;
}

.btn.orange{
  background:var(--orange);
}

.btn.gold{
  background:#9b7830;
}

.btn.block{
  width:100%;
}

/* ZEITRAFFER */

.zeitraffer{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0 18px;
}

.z-box{
  border:1px solid var(--line);
  border-radius:15px;
  background:#101513;
  padding:12px 7px;
  text-align:center;
}

.z-box .day{
  color:var(--green2);
  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
}

.z-box strong{
  display:block;
  color:var(--gold2);
  font-size:20px;
  margin-top:4px;
}

.z-box span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

/* PROGRAMM */

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:10px 0 15px;
}

.tab{
  border:1px solid var(--line);
  background:#101513;
  color:#dfe6e1;
  border-radius:12px;
  padding:11px 6px;
  font-weight:800;
  cursor:pointer;
}

.tab.active{
  background:var(--orange);
  border-color:var(--orange);
  color:#fff;
}

.day-card{
  border:1px solid var(--line);
  border-radius:19px;
  background:linear-gradient(135deg,#161d1a,#101513);
  padding:17px;
  margin-bottom:16px;
}

.day-card .kicker{
  font-size:11px;
  letter-spacing:2px;
  color:var(--green2);
  font-weight:900;
}

.day-card h2{
  margin:5px 0 0;
  font-size:24px;
}

.timeline{
  position:relative;
  margin:15px 0 0 2px;
}

.timeline:before{
  content:"";
  position:absolute;
  left:10px;
  top:11px;
  bottom:12px;
  width:2px;
  background:#39453f;
}

.event{
  position:relative;
  padding:0 0 17px 36px;
}

.event:before{
  content:"";
  position:absolute;
  left:4px;
  top:5px;
  width:14px;
  height:14px;
  border-radius:50%;
  background:var(--orange);
  box-shadow:0 0 0 4px #101513;
}

.event time{
  display:block;
  color:var(--gold2);
  font-size:14px;
  font-weight:900;
  margin-bottom:3px;
}

.event strong{
  display:block;
  font-size:16px;
}

.event p{
  margin:4px 0 0;
  color:#b8c5bd;
  line-height:1.4;
  font-size:14px;
}

.variant{
  border:1px solid var(--line);
  border-radius:17px;
  background:#101513;
  padding:16px;
  margin:11px 0;
}

.variant h3{
  margin:0;
  color:var(--orange);
  font-size:16px;
}

.variant p{
  margin:6px 0;
  color:#c8d3cc;
  line-height:1.45;
}

.variant .label{
  display:inline-block;
  font-size:11px;
  letter-spacing:1.5px;
  font-weight:900;
  color:var(--green2);
  margin-bottom:7px;
}

/* FOTOS */

.program-photo{
  width:100%;
  height:175px;
  object-fit:cover;
  border-radius:15px;
  margin:0 0 13px;
  display:block;
  border:1px solid var(--line);
}

/* ROUTEN */

.route-card{
  border:1px solid var(--line);
  border-radius:17px;
  background:#101513;
  padding:15px;
  margin:10px 0;
}

.route-card h3{
  margin:0 0 4px;
}

.route-card p{
  color:var(--muted);
  margin:4px 0;
  line-height:1.45;
}

/* ORTE */

.place{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#101513;
  padding:14px;
  margin:9px 0;
}

.place b{
  display:block;
}

.place small{
  display:block;
  color:var(--muted);
  margin-top:3px;
  line-height:1.35;
}

/* FOOTER */

.footer{
  text-align:center;
  color:#68736d;
  font-size:10px;
  letter-spacing:.4px;
  margin:34px 0 4px;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  z-index:60;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(760px,100%);
  height:76px;
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:rgba(4,7,6,.97);
  backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,255,255,.09);
}

.bottom button{
  border:0;
  background:transparent;
  color:#7e8983;
  cursor:pointer;
  font-size:20px;
}

.bottom button span{
  display:block;
  font-size:10px;
  margin-top:3px;
}

.bottom button.active{
  color:var(--green2);
}

/* MENÜ */

.drawer{
  position:fixed;
  z-index:70;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
}

.drawer.open{
  display:block;
}

.drawer-panel{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(350px,90%);
  background:#090d0b;
  border-left:1px solid var(--line);
  padding:20px;
  box-shadow:-20px 0 50px rgba(0,0,0,.4);
}

.drawer-panel h2{
  margin:6px 0 18px;
  color:var(--orange);
}

.drawer-panel button{
  width:100%;
  text-align:left;
  background:#101513;
  border:1px solid var(--line);
  color:#fff;
  border-radius:13px;
  padding:14px;
  margin:5px 0;
  cursor:pointer;
}

.close{
  float:right;
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  cursor:pointer;
}

.small-note{
  font-size:12px;
  color:#7e8983;
  line-height:1.45;
}

@media(max-width:480px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .hero h1{
    font-size:25px;
  }

  .hero .munich{
    font-size:30px;
  }

  .content{
    padding-left:13px;
    padding-right:13px;
  }
}
</style>

/* SEITEN LADEN */

function render(){

let html='';

if(page==='home') html=home();
else if(page==='programm') html=programm();
else if(page==='karte') html=karte();
else if(page==='infos') html=infos();
else if(page==='nachtleben') html=nachtleben();
else if(page==='fotos') html=fotos();
else if(page==='wetter') html=wetter();
else if(page==='mehr') html=mehr();

app.innerHTML=html;


/* ZEITRAFFER AUF PROGRAMM */

if(page==='programm'){
  const zr=document.querySelector('.zeitrraffer');
  if(zr) zr.outerHTML=zeitraffer();
}


/* NAVIGATION */

document.querySelectorAll('[data-page]').forEach(el=>{

  el.addEventListener('click',()=>{

    page=el.dataset.page;

    if(page==='programm'){
      day=day || 'do';
    }

    document.getElementById('drawer').classList.remove('open');

    render();

    window.scrollTo({
      top:0,
      behavior:'smooth'
    });

  });

});


/* TAGE */

document.querySelectorAll('[data-day]').forEach(el=>{

  el.addEventListener('click',()=>{

    day=el.dataset.day;

    render();

    window.scrollTo({
      top:0,
      behavior:'smooth'
    });

  });

});


/* COUNTDOWN */

if(page==='wetter'){
  countdown();
}

updateNav();

}


/* NAVIGATION AKTIV */

function updateNav(){

document.querySelectorAll('.bottom button').forEach(btn=>{

  btn.classList.toggle(
    'active',
    btn.dataset.page===page
  );

});

}


/* COUNTDOWN */

function countdown(){

const target=new Date('2026-10-15T14:00:00+02:00');

function update(){

  const now=new Date();

  let diff=target-now;

  const el=document.getElementById('countdown');

  if(!el) return;

  if(diff<=0){

    el.textContent='Der Jubiläumsausflug läuft! 🎉';

    return;
  }

  const days=Math.floor(diff/86400000);
  diff%=86400000;

  const hours=Math.floor(diff/3600000);
  diff%=3600000;

  const minutes=Math.floor(diff/60000);

  el.textContent=
    days+' Tage · '+
    hours+' Std. · '+
    minutes+' Min.';

}

update();

setInterval(update,30000);

}


/* MENÜ */

const drawer=document.getElementById('drawer');
const menuBtn=document.getElementById('menuBtn');
const closeDrawer=document.getElementById('closeDrawer');

menuBtn.addEventListener('click',()=>{
  drawer.classList.add('open');
});

closeDrawer.addEventListener('click',()=>{
  drawer.classList.remove('open');
});

drawer.addEventListener('click',e=>{
  if(e.target===drawer){
    drawer.classList.remove('open');
  }
});


/* START */

render();

</script>

</body>
</html>
