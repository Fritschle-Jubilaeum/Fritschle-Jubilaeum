<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111d">

<title>Fritschle · Jubiläumsausflug München 2026</title>

<style>
:root{
--bg:#07111d;
--bg2:#0b1726;
--panel:#102337;
--panel2:#142b41;
--line:#29435c;
--white:#fff;
--muted:#aebbc8;
--green:#78a64a;
--green2:#9bc36c;
--orange:#f28a2b;
--gold:#d8b15b;
--gold2:#f0d58a;
--shadow:0 18px 50px rgba(0,0,0,.28)
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
background:#050c14;
color:var(--white);
font-family:Inter,Arial,Helvetica,sans-serif;
-webkit-font-smoothing:antialiased
}

button,a{font:inherit}

.app{
width:min(760px,100%);
min-height:100vh;
margin:auto;
background:linear-gradient(180deg,#081522 0%,#0b1726 42%,#0b1827 100%);
box-shadow:0 0 80px rgba(0,0,0,.35);
position:relative
}

.top{
position:sticky;
top:0;
z-index:50;
height:70px;
padding:10px 16px;
display:flex;
align-items:center;
justify-content:space-between;
background:rgba(7,17,29,.94);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(255,255,255,.08)
}

.brand{
border:0;
background:transparent;
padding:0;
cursor:pointer
}

.brand img{
width:158px;
height:46px;
object-fit:contain;
object-position:left center;
display:block
}

.menu{
width:44px;
height:44px;
border:1px solid var(--line);
border-radius:13px;
background:#102337;
color:#fff;
font-size:23px;
cursor:pointer
}

.content{
padding:18px 16px 112px
}

.page{
animation:fade .22s ease
}

@keyframes fade{
from{opacity:.4;transform:translateY(4px)}
to{opacity:1;transform:none}
}

/* HERO */

.hero{
position:relative;
overflow:hidden;
border:1px solid #2b4358;
border-radius:26px;
background:
radial-gradient(circle at 50% 0%,#203b55 0,#102337 42%,#08131f 80%);
padding:28px 20px 12px;
text-align:center;
box-shadow:var(--shadow)
}

.hero .eyebrow{
position:relative;
z-index:2;
color:var(--green2);
font-size:12px;
letter-spacing:3px;
font-weight:800;
margin-bottom:14px
}

.seal{
position:relative;
z-index:2;
width:132px;
height:132px;
border:3px solid var(--gold);
border-radius:50%;
margin:auto;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:var(--gold2);
box-shadow:
0 0 0 8px rgba(216,177,91,.07),
inset 0 0 28px rgba(216,177,91,.07)
}

.seal b{
font-size:55px;
line-height:.85
}

.seal span{
font-size:16px;
letter-spacing:3px;
font-weight:800;
margin-top:8px
}

.hero h1{
position:relative;
z-index:2;
margin:20px 0 0;
font-size:29px;
letter-spacing:2.5px
}

.hero .munich{
position:relative;
z-index:2;
color:var(--orange);
font-size:34px;
font-weight:800;
font-style:italic;
margin-top:3px
}

.hero .date{
position:relative;
z-index:2;
color:#e8edf2;
font-weight:800;
letter-spacing:1.7px;
font-size:14px;
margin-top:8px
}

.tag{
position:relative;
z-index:2;
color:var(--green2);
font-weight:800;
margin:20px 0 24px
}

/* GOLDENE SKYLINE */

.skyline{
position:relative;
z-index:1;
height:86px;
margin:0 -20px;
overflow:hidden
}

.skyline svg{
position:absolute;
left:0;
bottom:0;
width:100%;
height:100%
}

.skyline path{
fill:none;
stroke:var(--gold);
stroke-width:2.2;
opacity:.92
}

.skyline .fill{
fill:rgba(216,177,91,.08);
stroke:none
}

/* GENERAL */

.section-title{
margin:25px 0 12px;
color:var(--orange);
font-size:23px;
letter-spacing:.2px
}

.lead{
color:#edf2f6;
line-height:1.65;
margin:0 0 13px
}

.notice{
border-left:4px solid var(--orange);
background:#10263a;
border-radius:0 15px 15px 0;
padding:14px 15px;
color:#fff;
line-height:1.55
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:11px;
margin-top:15px
}

.tile{
min-height:102px;
text-align:left;
border:1px solid var(--line);
border-radius:17px;
background:linear-gradient(145deg,#142b41,#0f2235);
color:#fff;
padding:16px;
cursor:pointer;
box-shadow:0 8px 22px rgba(0,0,0,.12)
}

.tile .ico{
font-size:22px;
color:var(--gold);
display:block;
margin-bottom:10px
}

.tile b{
display:block;
font-size:15px;
margin-bottom:5px
}

.tile small{
color:var(--muted);
line-height:1.35
}

.card{
border:1px solid var(--line);
background:linear-gradient(145deg,#142a40,#102235);
border-radius:18px;
padding:16px;
margin:11px 0;
box-shadow:0 10px 25px rgba(0,0,0,.13)
}

.card h3{
margin:0 0 8px;
font-size:17px
}

.card p{
color:#d5dfe7;
line-height:1.52;
margin:6px 0
}

.muted{
color:var(--muted)
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
text-decoration:none;
border:0;
border-radius:12px;
background:var(--green);
color:#fff;
font-weight:800;
padding:11px 14px;
cursor:pointer;
margin-top:9px
}

.btn.orange{
background:var(--orange)
}

.btn.gold{
background:#a98432
}

.btn.block{
width:100%
}

/* FOTOS */

.photo-card{
border:1px solid var(--line);
border-radius:18px;
overflow:hidden;
background:#102337;
margin:12px 0;
box-shadow:0 10px 25px rgba(0,0,0,.16)
}

.photo-card img{
width:100%;
height:190px;
display:block;
object-fit:cover
}

.photo-card .photo-text{
padding:14px 15px 16px
}

.photo-card h3{
margin:0 0 5px;
font-size:18px
}

.photo-card p{
margin:0;
color:var(--muted);
line-height:1.45
}

.photo-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:11px;
margin-top:14px
}

.photo-grid .photo-card{
margin:0
}

.photo-grid .photo-card img{
height:145px
}

.photo-grid .photo-text{
padding:11px
}

.photo-grid h3{
font-size:15px
}

/* PROGRAMM */

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin:10px 0 15px
}

.tab{
border:1px solid var(--line);
background:#102337;
color:#dfe6ec;
border-radius:12px;
padding:11px 6px;
font-weight:800;
cursor:pointer
}

.tab.active{
background:var(--orange);
border-color:var(--orange);
color:#fff
}

.day-card{
border:1px solid var(--line);
border-radius:19px;
background:linear-gradient(135deg,#172f46,#102337);
padding:17px;
margin-bottom:16px
}

.day-card .kicker{
font-size:11px;
letter-spacing:2px;
color:var(--green2);
font-weight:900
}

.day-card h2{
margin:5px 0 0;
font-size:24px
}

.timeline{
position:relative;
margin:15px 0 0 2px
}

.timeline:before{
content:"";
position:absolute;
left:10px;
top:11px;
bottom:12px;
width:2px;
background:#35536e
}

.event{
position:relative;
padding:0 0 17px 36px
}

.event:before{
content:"";
position:absolute;
left:4px;
top:5px;
width:14px;
height:14px;
border-radius:50%;
background:var(--orange);
box-shadow:0 0 0 4px #102337
}

.event time{
display:block;
color:var(--gold2);
font-size:14px;
font-weight:900;
margin-bottom:3px
}

.event strong{
display:block;
font-size:16px
}

.event p{
margin:4px 0 0;
color:#b8c5d0;
line-height:1.4;
font-size:14px
}

.change{
border:1px solid rgba(120,166,74,.65);
background:rgba(120,166,74,.1);
border-radius:16px;
padding:14px;
margin:12px 0
}

.change b{
color:var(--green2);
font-size:12px;
letter-spacing:1.5px
}

.change .new{
font-size:25px;
color:var(--green2);
font-weight:900;
margin-top:3px
}

.change del{
color:#728191;
margin-right:7px
}

.variant{
border:1px solid var(--line);
border-radius:17px;
background:#102337;
padding:16px;
margin:11px 0
}

.variant h3{
margin:0;
color:var(--orange);
font-size:16px
}

.variant p{
margin:6px 0;
color:#c8d3dc;
line-height:1.45
}

.variant .label{
display:inline-block;
font-size:11px;
letter-spacing:1.5px;
font-weight:900;
color:var(--green2);
margin-bottom:7px
}

/* ORTE */

.place{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
border:1px solid var(--line);
border-radius:16px;
background:#102337;
padding:14px;
margin:9px 0
}

.place b{
display:block
}

.place small{
display:block;
color:var(--muted);
margin-top:3px;
line-height:1.35
}

/* NIGHTLIFE */

.night{
border:1px solid var(--line);
border-radius:17px;
background:#102337;
padding:15px;
margin:10px 0
}

.night h3{
margin:0 0 4px;
color:#fff
}

.night .meta{
color:var(--gold2);
font-size:13px;
font-weight:800
}

.night p{
color:#bcc8d3;
line-height:1.45;
margin:7px 0
}

/* WEATHER */

.weather-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}

.weather-box{
background:#102337;
border:1px solid var(--line);
border-radius:14px;
text-align:center;
padding:13px
}

.weather-box b{
display:block;
color:var(--orange);
font-size:13px
}

.weather-box span{
display:block;
color:var(--muted);
margin-top:5px;
font-size:12px
}

.countdown{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px
}

.countdown .n{
border:1px solid var(--line);
background:#0c1d2f;
border-radius:13px;
padding:12px 4px;
text-align:center
}

.countdown strong{
display:block;
font-size:22px;
color:var(--gold2)
}

.countdown small{
color:var(--muted);
font-size:10px
}

/* FOOTER */

.footer{
text-align:center;
color:#8797a7;
font-size:11px;
margin:28px 0 4px
}

.powered{
text-align:center;
color:var(--gold2);
font-size:12px;
font-weight:700;
margin:8px 0 15px
}

/* NAVIGATION */

.bottom{
position:fixed;
z-index:60;
left:50%;
bottom:0;
transform:translateX(-50%);
width:min(760px,100%);
height:76px;
padding:7px 8px calc(7px + env(safe-area-inset-bottom));
display:grid;
grid-template-columns:repeat(5,1fr);
background:rgba(5,13,22,.97);
backdrop-filter:blur(14px);
border-top:1px solid rgba(255,255,255,.09)
}

.bottom button{
border:0;
background:transparent;
color:#7e8d9d;
cursor:pointer;
font-size:20px
}

.bottom button span{
display:block;
font-size:10px;
margin-top:3px
}

.bottom button.active{
color:var(--green2)
}

.drawer{
position:fixed;
z-index:70;
inset:0;
background:rgba(0,0,0,.58);
display:none
}

.drawer.open{
display:block
}

.drawer-panel{
position:absolute;
right:0;
top:0;
height:100%;
width:min(350px,90%);
background:#0b1726;
border-left:1px solid var(--line);
padding:20px;
box-shadow:-20px 0 50px rgba(0,0,0,.4)
}

.drawer-panel h2{
margin:6px 0 18px;
color:var(--orange)
}

.drawer-panel button{
width:100%;
text-align:left;
background:#102337;
border:1px solid var(--line);
color:#fff;
border-radius:13px;
padding:14px;
margin:5px 0;
cursor:pointer
}

.close{
float:right;
border:0;
background:transparent;
color:#fff;
font-size:25px;
cursor:pointer
}

.small-note{
font-size:12px;
color:#7e8d9d;
line-height:1.45
}

@media(max-width:480px){
.grid{
grid-template-columns:1fr 1fr
}

.hero h1{
font-size:25px
}

.hero .munich{
font-size:30px
}

.content{
padding-left:13px;
padding-right:13px
}

.photo-grid{
grid-template-columns:1fr
}

.photo-grid .photo-card img{
height:180px
}
}
</style>
</head>

function render(){

app.innerHTML=
pages[page]
? pages[page]()
: pages.home();


document
.querySelectorAll('.bottom [data-page]')
.forEach(b=>
b.classList.toggle(
'active',
b.dataset.page===page
)
);


document
.querySelectorAll('[data-page]')
.forEach(b=>
b.onclick=()=>{
closeDrawer();
nav(b.dataset.page)
}
);


document
.querySelectorAll('[data-day]')
.forEach(b=>
b.onclick=()=>{
day=b.dataset.day;
render()
}
);


if(page==='wetter')
startCountdown();

}


function startCountdown(){

const el=document.getElementById('countdown');

if(!el)return;

const target=
new Date('2026-10-15T14:00:00+02:00').getTime();

const tick=()=>{

const d=Math.max(
0,
target-Date.now()
);

const days=
Math.floor(d/86400000);

const hrs=
Math.floor(
d%86400000/3600000
);

const min=
Math.floor(
d%3600000/60000
);

const sec=
Math.floor(
d%60000/1000
);


el.innerHTML=`

<div class="n">
<strong>${days}</strong>
<small>Tage</small>
</div>

<div class="n">
<strong>${String(hrs).padStart(2,'0')}</strong>
<small>Std.</small>
</div>

<div class="n">
<strong>${String(min).padStart(2,'0')}</strong>
<small>Min.</small>
</div>

<div class="n">
<strong>${String(sec).padStart(2,'0')}</strong>
<small>Sek.</small>
</div>

`;

};

tick();

clearInterval(window.__timer);

window.__timer=
setInterval(tick,1000);

}

const closeDrawer=

drawer.classList.remove('open')
};

.getElementById('menuBtn')
.onclick=()=>{

};

document
.getElementById('closeDrawer')
.onclick=closeDrawer;

drawer.onclick=e=>{
if(e.target===drawer)

};
