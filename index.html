<body>

<div class="app" id="app"></div>

<nav class="bottom-nav">

</button>

<script>
const app=document.getElementById('app');
let page=location.hash.replace('#','')||'home';

let quizIndex=0;
let quizScore=0;
let quizChoice=null;
let quizAnswered=false;

const quizQuestions=[
{
question:'In welchem Jahr wurde das Hofbräuhaus gegründet?',
answers:['1489','1589','1689'],
correct:1,
explanation:'Das Hofbräuhaus wurde 1589 gegründet.'
},
{
question:'Wofür ist das Neue Rathaus am Marienplatz besonders bekannt?',
answers:['Für sein Glockenspiel','Für eine große Glaskuppel','Für einen Leuchtturm'],
correct:0,
explanation:'Das Glockenspiel am Neuen Rathaus ist eine der bekanntesten Sehenswürdigkeiten Münchens.'
},
{
question:'Was ist die BMW Welt?',
answers:['Ein Fußballstadion','Ein Erlebnis- und Ausstellungszentrum rund um BMW','Ein großer Biergarten'],
correct:1,
explanation:'In der BMW Welt dreht sich alles um Fahrzeuge, Technik und die Marke BMW.'
},
{
question:'Welcher Fußballverein trägt seine Heimspiele in der Allianz Arena aus?',
answers:['TSV 1860 Rosenheim','FC Augsburg','FC Bayern München'],
correct:2,
explanation:'Die Allianz Arena ist das Heimstadion des FC Bayern München.'
},
{
question:'Was findet man hauptsächlich auf dem Viktualienmarkt?',
answers:['Lebensmittel und Marktstände','Achterbahnen','Skisprungschanzen'],
correct:0,
explanation:'Der Viktualienmarkt ist ein bekannter Lebensmittelmarkt mitten in München.'
},
{
question:'Welcher Fluss fließt durch München?',
answers:['Die Donau','Die Isar','Der Rhein'],
correct:1,
explanation:'Die Isar fließt durch München und ist besonders an warmen Tagen ein beliebter Treffpunkt.'
},
{
question:'Wo findet das Münchner Oktoberfest traditionell statt?',
answers:['Am Marienplatz','Im Englischen Garten','Auf der Theresienwiese'],
correct:2,
explanation:'Das Oktoberfest findet auf der Theresienwiese statt.'
},
{
question:'An welchem Platz liegt das Hofbräuhaus?',
answers:['Am Platzl','Am Königsplatz','Am Odeonsplatz'],
correct:0,
explanation:'Die Adresse des Hofbräuhauses lautet Platzl 9.'
},
{
question:'Woran erkennt man die Frauenkirche in München besonders?',
answers:['An vier Türmen','An ihren zwei markanten Türmen','An einem einzelnen roten Turm'],
correct:1,
explanation:'Die Frauenkirche ist für ihre zwei markanten Türme mit den charakteristischen Kuppeln bekannt.'
},
{
question:'Was erwartet Euch im GOP Varieté-Theater?',
answers:['Varieté-Unterhaltung und Show','Eine Fußballführung','Eine Automobilausstellung'],
correct:0,
explanation:'Im GOP Varieté-Theater stehen Shows und Varieté-Unterhaltung auf dem Programm.'
}
];

function resetQuiz(){
quizIndex=0;
quizScore=0;
quizChoice=null;
quizAnswered=false;
nav('quiz');
}

function answerQuiz(index){
if(quizAnswered) return;
quizChoice=index;
quizAnswered=true;
if(index===quizQuestions[quizIndex].correct) quizScore++;
render();
}

function nextQuiz(){
quizIndex++;
quizChoice=null;
quizAnswered=false;
render();
window.scrollTo(0,0);
}

function quiz(){
const total=quizQuestions.length;
if(quizIndex>=total){
let message='Da ist noch Luft nach oben – vielleicht spielt Ihr gleich noch eine Runde!';
if(quizScore>=8) message='München-Profi! Ihr kennt Euch richtig gut aus.';
else if(quizScore>=5) message='Gut gemacht! Ihr kennt schon einige Münchner Highlights.';
return `
<section class="page">
<h1 class="section-title">🏆 München-Quiz</h1>
<p class="sub">Das Quiz ist geschafft – wie gut kennt Ihr München?</p>
<div class="quiz-card">
<div class="muted">Euer Ergebnis</div>
<div class="quiz-score">${quizScore} von ${total} Punkten</div>
<p>${message}</p>
<div class="quiz-progress"><span style="width:100%"></span></div>
<button class="quiz-action" onclick="resetQuiz()">Noch einmal spielen</button>
<button class="quiz-action quiz-secondary" onclick="nav('mehr')">Zurück zu Mehr</button>
</div>
</section>
`;
}

const q=quizQuestions[quizIndex];
const progress=(quizIndex/total)*100;
const answers=q.answers.map((answer,index)=>{
let cls='quiz-answer';
if(quizAnswered && index===q.correct) cls+=' correct';
else if(quizAnswered && index===quizChoice) cls+=' wrong';
return `<button class="${cls}" onclick="answerQuiz(${index})">${String.fromCharCode(65+index)}. ${answer}</button>`;
}).join('');

let feedback='';
if(quizAnswered){
const correct=quizChoice===q.correct;
feedback=`
<div class="quiz-feedback ${correct?'good':'bad'}">
<strong>${correct?'Richtig! 🎉':'Leider nicht ganz.'}</strong>
<p>${q.explanation}</p>
</div>
<button class="quiz-action" onclick="nextQuiz()">${quizIndex===total-1?'Ergebnis anzeigen':'Nächste Frage →'}</button>
`;
}

return `
<section class="page">
<h1 class="section-title">🏆 München-Quiz</h1>
<p class="sub">10 Fragen rund um München und unsere Ausflugsziele.</p>
<div class="quiz-card">
<div class="muted">Frage ${quizIndex+1} von ${total} · Punktestand: ${quizScore}</div>
<div class="quiz-progress"><span style="width:${progress}%"></span></div>
<h2 class="quiz-question">${q.question}</h2>
${answers}
${feedback}
</div>
<button class="quiz-action quiz-secondary" onclick="nav('mehr')">Zurück zu Mehr</button>
</section>
`;
}

}
else{
body=mehr();
}

app.innerHTML=`
<header class="top">
<button class="menu" onclick="openDrawer()" aria-label="Menü">☰</button>
</header>
<main class="content">
${body}
</main>
`;

document.querySelectorAll('.nav-btn').forEach(b=>{
b.classList.toggle(
'active',
b.dataset.page===page ||
(
(page==='info' ||
page==='nachtleben' ||
page==='wetter' ||
page==='taxi' ||
page==='quiz')
&&
b.dataset.page==='mehr'
)
);
});

updateCountdown();
}

function updateCountdown(){
const el=document.getElementById('countdown');

if(!el){
return;
}

const target=
new Date('2026-10-15T14:00:00+02:00').getTime();

const now=Date.now();
let diff=target-now;

if(diff<=0){
el.textContent='Der Jubiläumsausflug hat begonnen!';
return;
}

const d=Math.floor(diff/86400000);
diff%=86400000;

const h=Math.floor(diff/3600000);
diff%=3600000;

const m=Math.floor(diff/60000);

el.textContent=`Noch ${d} Tage, ${h} Stunden und ${m} Minuten`;
}

document.querySelectorAll('.nav-btn').forEach(b=>{
b.addEventListener('click',()=>nav(b.dataset.page));
});

window.addEventListener('hashchange',()=>{
const h=location.hash.replace('#','');

if(h){
page=h;
render();
}
});

if(location.hash){
page=location.hash.replace('#','')||'home';
}

render();

setInterval(updateCountdown,60000);
updateNextProgramPoint();
setInterval(updateNextProgramPoint,60000);
</script>

</body>
</html>
