<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<meta name="description" content="Fritschle – 80 Jahre Jubiläumsausflug München, 15.–17. Oktober 2026">
<title>Fritschle · Jubiläumsausflug München · 2026</title>

<style>
:root{
--bg:#07111d;
--bg2:#0b1726;
--panel:#102337;
--panel2:#142b41;
--line:#29435c;
--white:#fff;
--muted:#aebbc8;
--green:#78a64a;
--green2:#9bc36c;
--orange:#f28a2b;
--gold:#d8b15b;
--gold2:#f0d58a;
--shadow:0 18px 50px rgba(0,0,0,.28)
}

*{box-sizing:border-box}

html{
scroll-behavior:smooth
}

body{
margin:0;
background:#050c14;
color:var(--white);
font-family:Inter,Arial,Helvetica,sans-serif;
-webkit-font-smoothing:antialiased
}

button,a{
font:inherit
}

.app{
width:min(760px,100%);
min-height:100vh;
margin:auto;
background:linear-gradient(
180deg,
#081522 0%,
#0b1726 42%,
#0b1827 100%
);
box-shadow:0 0 80px rgba(0,0,0,.35);
position:relative
}

.top{
position:sticky;
top:0;
z-index:50;
height:70px;
padding:10px 16px;
display:flex;
align-items:center;
justify-content:flex-end;
background:rgba(7,17,29,.94);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(255,255,255,.08)
}

.brand{
border:0;
background:transparent;
padding:0;
cursor:pointer
}

.brand img{
width:158px;
height:46px;
object-fit:contain;
object-position:left center;
display:block
}

.menu{
width:44px;
height:44px;
border:1px solid var(--line);
border-radius:13px;
background:#102337;
color:#fff;
font-size:23px;
cursor:pointer
}

.content{
padding:18px 16px 112px
}

.page{
animation:fade .22s ease
}

@keyframes fade{
from{
opacity:.4;
transform:translateY(4px)
}
to{
opacity:1;
transform:none
}
}

/* STARTSEITE */

.hero{
position:relative;
overflow:hidden;
border:1px solid #2b4358;
border-radius:26px;
background:#050b12;
padding:25px 20px 25px;
text-align:center;
box-shadow:var(--shadow);
min-height:650px
}

.hero>*{
position:relative;
z-index:2
}

.hero-brand{
text-align:left;
margin:0 0 14px
}

.hero-brand strong{
display:block;
color:#fff;
font-size:31px;
line-height:1;
font-weight:900;
letter-spacing:4px
}

.hero-brand span{
display:block;
color:#fff;
font-size:11px;
line-height:1;
margin-top:5px;
letter-spacing:1.5px
}

.hero-brand i{
display:inline-block;
width:7px;
height:7px;
background:var(--orange);
border-radius:0;
margin-left:4px;
vertical-align:middle
}

.seal{
width:126px;
height:126px;
border:2px solid var(--gold);
border-radius:50%;
margin:8px auto 18px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:rgba(5,11,18,.64);
box-shadow:0 0 30px rgba(216,177,91,.18)
}

.seal:before,
.seal:after{
content:"✦";
color:var(--gold2);
font-size:13px;
margin:2px
}

.seal b{
font-size:49px;
line-height:.8;
color:var(--gold2);
font-weight:900
}

.seal span{
font-size:13px;
letter-spacing:4px;
color:#fff;
margin-top:7px
}

.hero h1{
margin:10px 0 0;
font-size:24px;
letter-spacing:2px
}

.munich{
font-family:"Brush Script MT","Brush Script Std",cursive;
font-size:54px;
font-weight:900;
font-style:italic;
color:var(--orange);
line-height:1.05;
margin-top:4px;
text-shadow:0 3px 22px #000
}

.date{
font-size:16px;
letter-spacing:2px;
margin-top:10px;
color:#fff
}

.welcome{
margin:24px auto 0;
max-width:560px;
padding:18px;
border:1px solid rgba(216,177,91,.38);
border-radius:18px;
background:rgba(5,11,18,.62);
text-align:left
}

.welcome h2{
margin:0 0 10px;
color:var(--orange);
font-size:24px;
font-family:"Brush Script MT","Brush Script Std",cursive;
font-style:italic
}

.welcome p{
margin:7px 0;
line-height:1.55;
color:#f2f5f7
}

/* GOLDENE MÜNCHEN-SKYLINE AUF DER STARTSEITE */

.home-photo{
width:100%;
max-width:560px;
height:auto;
object-fit:contain;
display:block;
margin:16px auto 0;
border-radius:18px;
border:1px solid rgba(216,177,91,.38);
box-shadow:0 12px 30px rgba(0,0,0,.28)
}

/* ALLGEMEIN */

.section-title{
font-size:29px;
margin:8px 0 15px
}

.sub{
color:var(--muted);
margin-top:-7px;
margin-bottom:18px
}

.tabs{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:14px
}

.tab{
border:1px solid var(--line);
background:#0e2032;
color:#fff;
border-radius:14px;
padding:11px 5px;
cursor:pointer;
font-weight:800
}

.tab.active{
background:var(--orange);
border-color:var(--orange)
}

.tab small{
font-weight:500;
opacity:.85
}

.day-card,
.card,
.variant,
.change,
.night,
.route,
.info-box{
background:linear-gradient(
180deg,
#102337,
#0d1e2f
);
border:1px solid var(--line);
border-radius:20px;
box-shadow:var(--shadow);
overflow:hidden
}

.program-photo{
width:100%;
height:220px;
object-fit:cover;
object-position:center;
display:block;
grid-column:1 / -1;
border-radius:14px;
margin-top:10px;
margin-bottom:6px
}

.landscape-photo{
grid-column:1 / -1;
display:block;
width:calc(100% + 70px);
max-width:none;
height:220px !important;
aspect-ratio:16 / 9;
object-fit:cover;
object-position:center;
margin-top:10px;
margin-left:-35px;
margin-right:-35px;
margin-bottom:6px;
border-radius:0
}

.variant-photo{
width:100%;
height:150px;
object-fit:cover;
display:block;
border-radius:12px;
margin-bottom:14px
}

.kicker{
font-size:11px;
letter-spacing:2px;
color:var(--green2);
font-weight:900;
padding:18px 18px 4px
}

.day-card h2{
margin:2px 18px 18px;
font-size:27px
}

.timeline{
padding:0 18px 18px
}

.event{
display:grid;
grid-template-columns:82px 1fr;
gap:10px;
padding:15px 0;
border-top:1px solid rgba(255,255,255,.08)
}

.event time{
font-size:18px;
font-weight:900;
color:var(--orange);
white-space:nowrap
}

.event time.small-time{
font-size:15px
}

.event strong{
font-size:16px;
line-height:1.35
}

.event p{
grid-column:2;
margin:4px 0 0;
color:var(--muted);
line-height:1.45
}

/* FREITAG VARIANTEN */

.variant{
padding:18px;
margin-top:12px
}

.variant .label{
display:inline-block;
color:#06101a;
background:var(--green2);
font-size:11px;
font-weight:900;
padding:6px 9px;
border-radius:8px;
letter-spacing:1px
}

.variant h3{
font-size:22px;
margin:11px 0 6px
}

.variant p{
margin:0;
color:var(--muted);
line-height:1.45
}

.btn{
display:inline-block;
margin-top:12px;
padding:10px 13px;
border-radius:11px;
background:var(--orange);
color:#fff;
text-decoration:none;
font-weight:800
}

/* KARTE */

.map-card{
height:430px;
border:1px solid var(--line);
border-radius:20px;
overflow:hidden;
background:#152231;
position:relative
}

.map-card iframe{
width:100%;
height:100%;
border:0;
filter:saturate(.72) brightness(.76)
}

.map-overlay{
position:absolute;
left:12px;
right:12px;
bottom:12px;
display:flex;
gap:8px;
flex-wrap:wrap
}

.map-chip{
background:rgba(7,17,29,.9);
border:1px solid var(--line);
padding:8px 10px;
border-radius:10px;
font-size:12px
}

.route{
padding:15px;
margin-top:12px
}

.route strong{
display:block;
font-size:16px
}

.route span{
display:block;
color:var(--muted);
font-size:13px;
margin-top:4px
}

/* NACHTLEBEN */

.night{
padding:0;
margin-top:12px
}

.night img{
width:100%;
height:145px;
object-fit:cover;
display:block
}

.night .inside{
padding:15px
}

.night h3{
margin:0 0 5px;
font-size:20px
}

.night p{
margin:4px 0;
color:var(--muted);
line-height:1.45
}

/* INFO */

.info-box{
padding:17px;
margin-top:12px
}

.info-box h3{
margin:0 0 9px;
color:var(--green2);
font-size:18px
}

.info-box p,
.info-box li{
color:#dbe3e9;
line-height:1.5
}

.info-box ul{
padding-left:20px
}

.bottom-nav{
position:fixed;
z-index:60;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(760px,100%);
display:grid;
grid-template-columns:repeat(5,1fr);
padding:9px 8px calc(9px + env(safe-area-inset-bottom));
background:rgba(7,17,29,.96);
backdrop-filter:blur(16px);
border-top:1px solid rgba(255,255,255,.1)
}

.nav-btn{
border:0;
background:none;
color:#aebbc8;
font-size:11px;
padding:5px 2px;
cursor:pointer
}

.nav-btn .ico{
display:block;
font-size:20px;
margin-bottom:3px
}

.nav-btn.active{
color:var(--orange);
font-weight:900
}

/* MENÜ */

.drawer{
position:fixed;
z-index:100;
top:0;
right:-330px;
width:min(330px,88vw);
height:100vh;
background:#0b1726;
border-left:1px solid var(--line);
padding:22px;
transition:.25s;
box-shadow:-20px 0 50px rgba(0,0,0,.4)
}

.drawer.open{
right:0
}

.drawer button{
display:block;
width:100%;
text-align:left;
border:1px solid var(--line);
background:#102337;
color:#fff;
padding:14px;
border-radius:12px;
margin:8px 0;
cursor:pointer
}

.drawer .close{
background:var(--orange);
border-color:var(--orange)
}

.muted{
color:var(--muted)
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.pill{
display:inline-block;
border-radius:999px;
padding:6px 10px;
background:#173048;
color:#dfe8ef;
font-size:12px;
margin:3px
}

.footer{
text-align:center;
color:#718292;
font-size:12px;
margin:24px 0 0;
padding-bottom:15px
}

.footer .credit{
display:block;
margin-top:7px;
color:#aebbc8;
letter-spacing:.4px
}

@media(max-width:520px){

.hero{
min-height:620px;
padding-left:16px;
padding-right:16px
}

.hero h1{
font-size:22px
}

.munich{
font-size:47px
}

.event{
grid-template-columns:70px 1fr
}

.event time{
font-size:16px
}

.event time.small-time{
font-size:14px
}

.grid2{
grid-template-columns:1fr
}

.program-photo{
height:190px;
object-fit:cover
}

.landscape-photo{
grid-column:1 / -1;
width:calc(100% + 70px);
max-width:none;
height:190px !important;
aspect-ratio:16 / 9;
object-fit:cover;
object-position:center;
margin-left:-35px;
margin-right:-35px;
margin-top:10px;
margin-bottom:6px;
border-radius:0
}

.home-photo{
height:auto;
max-width:100%
}

}
</style>
</head>

<main class="content">

</main>

`;

.forEach(b => {

b.classList.toggle(
'active',
b.dataset.page===page ||
(
(page==='nachtleben'||page==='wetter') &&
b.dataset.page==='mehr'
)
);

});


updateCountdown();


}


/* COUNTDOWN */

function updateCountdown(){

const el=document.getElementById('countdown');

if(!el){
return;
}

const target=
new Date(
'2026-10-15T14:00:00+02:00'
).getTime();

const now=Date.now();

let diff=target-now;

if(diff<=0){

el.textContent=
'Der Jubiläumsausflug hat begonnen!';

return;

}


const d=
Math.floor(
diff/86400000
);

diff%=86400000;


const h=
Math.floor(
diff/3600000
);

diff%=3600000;


const m=
Math.floor(
diff/60000
);


el.textContent=
`Noch ${d} Tage, ${h} Stunden und ${m} Minuten`;

}


/* NAVIGATION */

document
.querySelectorAll('.nav-btn')
.forEach(b => {

b.addEventListener(
'click',
() => nav(b.dataset.page)
);

});


window.addEventListener(
'hashchange',
() => {

const h=
location.hash.replace('#','');

if(h){

page=h;

render();

}

}
);


/* START */

if(location.hash){

page=
location.hash.replace('#','') ||
'home';

}

render();

setInterval(
updateCountdown,
60000
);

</script>
